# Example: intelligence (columns) x realtime (rows) conversation grid
title: "对话类型在「智能强度 x 实时性 y」上的分布示意（含适中）"
layout:
  fig_width_in: 14
  fig_height_in: 10
  dpi: 150
style:
  figure_facecolor: "#121212"
  cell_facecolor: "#2a2a2a"
  edgecolor: "#888888"
  linewidth: 1.2
  text_color: "#eaeaea"
  title_color: "#ffffff"
  font_size_title: 13
  font_size_header: 11
  font_size_cell: 9
  font_family: "Noto Sans CJK JP"
rows:
  - - "实时性\n↓\n慢→快"
    - "弱智能"
    - "适中"
    - "强智能"
  - - "慢实时"
    - "模板寒暄堆砌\n空洞拖延慢回\n低信息量长回合"
    - "日常话题慢热展开\n轻度追问深挖\n回忆叙事拉片"
    - "深度思辨\n长链推理\n研究综述"
  - - "适中实时"
    - "FAQ轮播占位\n转接排队话术\n免责长说明"
    - "目标对齐协作\n轻度讲解带练\n有来有往闲聊"
    - "多步技术排障\nAB方案权衡\n结构化访谈追问"
  - - "快实时"
    - "问候礼貌回合\n收到确认短回\n简单指令应答"
    - "一句话进度同步\n轻量建议点拨\n破冰不尬场"
    - "强情绪当下承接\n危机安抚稳态\n冲突现场修复"
