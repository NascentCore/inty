[project]
name = "inty-backend"
version = "1.1.0"
description = "Inty backend server"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "black>=24",
    "pylint>=3.2",
    "ruff>=0.9",
    "vulture>=2.14",
]

[tool.black]
line-length = 80
target-version = ["py312"]

[tool.ruff]
line-length = 80
target-version = "py312"

[tool.pylint.main]
rcfile = "pylintrc"

# 用于运行 uv ty check 命令，排除不需要类型检查的目录。
[tool.ty.src]
exclude = [
    "experimental",
    "evaluation",
    "tools/scripts",
    "tests",
    "**/migrations",
]
