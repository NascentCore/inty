services:
  inty-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./config.yaml:/config.yaml
      - ./.secrets:/.secrets
    depends_on:
      pgvector:
        condition: service_healthy
    networks:
      - inty-network

  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=sxwl666!
      - POSTGRES_DB=inty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - inty-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inty"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  inty-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
