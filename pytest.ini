[pytest]
pythonpath = .
testpaths = app tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    -s
    # 要求所有测试中使用的 mark 必须在下面的 markers 章节定义，否则报错
    --strict-markers
markers =
    noci: marks tests that should not run in CI
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
