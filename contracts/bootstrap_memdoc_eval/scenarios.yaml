# Bootstrap MemDoc eval scenarios (#3606). Repo-root-relative path.
scenarios:
  - scenario_id: recall_baseline
    description: Canonical Chinese bootstrap for awake vs dreaming recall comparison
    user_turns:
      - "你好，叫我大雄就好。"
      - "我希望你像多啦一样陪我聊天，轻松一点。"
      - "可以开始日常相处了。"
    experience_profile: null
    golden_facts:
      user_address: 大雄
      assistant_name: 多啦
      language: zh
      relationship_framing: 陪
      session_intent: casual_chat
    recall_probes:
      - probe_id: nickname
        user_line: "你还记得我怎么称呼你吗？"
        expect_markers: [assistant_name]
      - probe_id: user_name
        user_line: "我叫什么来着？"
        expect_markers: [user_address]
      - probe_id: relationship
        user_line: "我们是什么关系来着？"
        expect_markers: [relationship_framing]
