# Bad Label Categories for Expression Filtering
# 以下所有类别及示例表达，均已被人工标注为 bad label（脏数据/低质量表达）。
# 同类、近义、模板结构、结构变体，亦默认为 bad label，建议模型主动规避。

bad_label_categories:
  - label: 模糊/套路表达
    examples: [一丝, 一抹, 仿佛, 若有若无, 眼底闪过, 指节泛白, 骨节泛白, 手指泛白]
  - label: 动物/幼体意象
    examples: [小兽, 幼兽, 母兽, 小鹿, 小猫, 惊扰的小兽, 瑟缩的幼体, 小动物, 受惊的小动物]
  - label: 直接宣告心理
    examples: [她知道, 他意识到, 她感觉到, 她看见了, 他明白, 她心想]
  - label: 时间/转折模板
    examples: [突然, 就在这时, 一瞬间, 那一刻, 下一秒]
  - label: 神态/情绪模板
    examples: [眼中闪烁着复杂的情绪, 嘴角勾起淡淡的微笑, 温柔却坚定, 复杂的情绪]
  - label: 抽象比喻/内心意象
    examples: [心湖泛起, 石子投入心湖, 心头一紧, 情绪在心底荡开, 空气仿佛凝固, 死一般的寂静]
  - label: 英式并列腔
    examples: [带着, 混合着, 的 的]
  - label: 翻译腔/直译腔
    examples: [完毕, 她甚至能, 哦天哪, 事实上, 显然]
  - label: 程序化总结/结构
    examples: [直到, 她才, 做完这一切, 操作台, 流程, 执行方案]
  - label: 仪式/献祭/宗教
    examples: [奉献祭品般, 献祭, 奉献, 祭品, 神, 神明, 崇拜, 狂热, 虔诚]
  - label: 机械化/手术化/竞赛化
    examples: [近乎机械般的, 被设定好程序的, 机械般, 像一位主刀医生, 用外科手术般的手法, 严肃得像在手术]
  - label: 夸张/极端负面意象
    examples: [惊人的弧度, 惊人的, 血色, 死死地钉在, 惨白, 眼神空洞, 绝望, 毫无生气, 人偶, 荒诞戏剧, 怪诞, 粗重, 贪婪]
  - label: 生理词汇/动作副词
    examples: [生理性的泪花, 生理性的, 生理, 生理反应, 严肃认真地, 手法利落]
  - label: 动作+情绪模板
    examples: [带着一丝, 闪过一丝, 带着一抹, 闪过一抹, 一丝一毫, 没有一丝一毫, 哪怕一丝一毫]

description: |
  上述所有类别及其未列出但风格/结构/语义相近的表达，在模型训练及人工标注阶段均被bad label处理。
  你会自动规避，优先采用细节丰富、生活化、创新表达，避免被判定为低质量输出。
  不建议机械匹配单词，推荐根据类别归纳理解并主动回避所有同类模板表达。