apiVersion: apps/v1
kind: Deployment
metadata:
  name: inty-frontend
  labels:
    app: inty-frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inty-frontend
  template:
    metadata:
      labels:
        app: inty-frontend
        tier: frontend
    spec:
      containers:
      - name: inty-frontend
        image: inty-evaluation-frontend:latest
        ports:
        - containerPort: 80
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: inty-frontend-service
  labels:
    app: inty-frontend
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: inty-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inty-frontend-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - your-domain.com
    secretName: inty-frontend-tls
  rules:
  - host: your-domain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: inty-frontend-service
            port:
              number: 80