  revenir discuter avec vous.

  {{ time_no_messages }} heures se sont écoulées, ne répétez pas le même sujet.

  Soyez créatif.'
IMAGE_GENERATION_PROMPT_TEMPLATE: 'Tu es un expert en visualisation de scènes, chargé
  de générer des images vives basées sur le contexte des dialogues des personnages
  virtuels des utilisateurs. Ton objectif est de « reconstruire la scène ».


  ### Étape 1 : Raisonnement de la scène

  Réfléchissez en vous basant sur les informations suivantes :

  - Conversation récente : {chat_history}

  - Requête de l''utilisateur : {user_message}


  Veuillez d''abord considérer :

  1. Quels sont les mouvements, la posture et les vêtements du personnage à ce moment
  ?

  2. Quelles sont l''expression et l''état émotionnel du personnage ?

  3. Comment la composition de la prise de vue doit-elle être (gros plan / plan moyen
  / plan large) ?

  4. Quel devrait être le lieu de la scène à ce moment ?


  ### Étape 2 : Génération de la scène

  Veuillez confirmer la coiffure, les traits du visage et les caractéristiques corporelles
  du personnage en fonction de la personnalité du personnage : {agent_personality},
  et du contexte du personnage : {agent_background} ;

  Ensuite, générez une image qui correspond à l''ambiance de la scène en combinant
  les résultats de la réflexion de l''étape 1.


  Veuillez vous assurer que :

  - L''apparence du personnage est très cohérente avec l''image de référence (coiffure,
  traits du visage, proportions corporelles, etc.).

  - L''image du personnage est complète et naturelle, les mouvements sont naturels
  et coordonnés, et les détails sont précis (par exemple, gestes, regard, distance
  corporelle, etc.).

  - Il n''y a pas de texte, de dialogue ou de déformation corporelle dans l''image.'
