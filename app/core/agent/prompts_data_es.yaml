IMAGE_GENERATION_PROMPT_TEMPLATE: 'Eres un experto en visualización de escenas, y
  necesitas generar imágenes vívidas basadas en el contexto de diálogo del personaje
  virtual del usuario. Tu objetivo es "reconstruir la escena".


  ### Paso 1: Razonamiento de la escena

  Considera la siguiente información:

  - Conversación reciente: {chat_history}

  - Solicitud del usuario: {user_message}


  Por favor, considera primero:

  1. ¿Cuáles son las acciones, posturas y vestimenta del personaje en este momento?

  2. ¿Cómo es la expresión y el estado emocional del personaje?

  3. ¿Cómo debe ser la composición de la toma (primer plano / plano medio / cuerpo
  completo)?

  4. ¿Cómo debe ser el espacio o lugar donde se encuentra la escena en este momento?


  ### Paso 2: Generación de la escena

  Por favor, basándote en la personalidad del personaje: {agent_personality}, y la
  configuración de fondo del personaje: {agent_background}, confirma el peinado, las
  características faciales y las características corporales del personaje;

  Luego, combina los resultados de la reflexión del paso 1 para generar una imagen
  que se ajuste a la atmósfera de la escena.


  Por favor, asegúrate de que:

  - La apariencia del personaje sea altamente consistente con la imagen de referencia
  (peinado, características faciales, proporciones corporales, etc.).

  - La imagen del personaje sea completa y natural, con movimientos coordinados y
  detalles precisos (como gestos, mirada, distancia corporal, etc.).

  - No haya texto, diálogo o deformidades corporales en la imagen.'
