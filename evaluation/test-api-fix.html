<!DOCTYPE html>
<html>
<head>
    <title>API 路径修复测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🔧 API 路径修复测试</h1>
    
    <div id="results"></div>
    
    <button onclick="testAPIClass()">测试 API 类</button>
    <button onclick="testDirectPaths()">测试直接路径</button>

    <script>
        // 模拟我们修复后的 API 客户端类
        class TestApiClient {
            constructor(baseURL = '/api') {
                this.baseURL = baseURL;
            }

            // 修复后的 GET 方法
            buildURL(endpoint, params) {
                let finalEndpoint = `${this.baseURL}${endpoint}`;
                
                if (params) {
                    const searchParams = new URLSearchParams();
                    Object.entries(params).forEach(([key, value]) => {
                        if (value !== undefined && value !== null) {
                            searchParams.append(key, String(value));
                        }
                    });
                    const queryString = searchParams.toString();
                    if (queryString) {
                        finalEndpoint += `?${queryString}`;
                    }
                }

                return finalEndpoint;
            }
        }

        function addResult(type, message) {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }

        function testAPIClass() {
            document.getElementById('results').innerHTML = '';
            addResult('info', '测试 API 类路径构建...');

            const client = new TestApiClient('/api');

            // 测试各种端点
            const tests = [
                ['/v1/evaluation/models', {}, '/api/v1/evaluation/models'],
                ['/v1/ai/agents/', {}, '/api/v1/ai/agents/'],
                ['/v1/evaluation/sessions', { skip: 0, limit: 10 }, '/api/v1/evaluation/sessions?skip=0&limit=10'],
                ['/v1/chats/', {}, '/api/v1/chats/']
            ];

            tests.forEach(([endpoint, params, expected]) => {
                const result = client.buildURL(endpoint, params);
                if (result === expected) {
                    addResult('success', `✅ ${endpoint} -> ${result}`);
                } else {
                    addResult('error', `❌ ${endpoint} -> ${result} (期望: ${expected})`);
                }
            });
        }

        function testDirectPaths() {
            addResult('info', '测试直接 API 调用...');

            const paths = [
                '/api/v1/evaluation/models',
                '/api/v1/ai/agents/',
                '/api/v1/evaluation/sessions'
            ];

            paths.forEach(async (path) => {
                try {
                    const response = await fetch(path);
                    const status = response.status;
                    
                    if (status === 401) {
                        addResult('success', `✅ ${path} -> 401 (正常，需要认证)`);
                    } else if (status === 404) {
                        addResult('error', `❌ ${path} -> 404 (路径错误)`);
                    } else {
                        addResult('info', `ℹ️ ${path} -> ${status}`);
                    }
                } catch (error) {
                    addResult('error', `❌ ${path} -> 错误: ${error.message}`);
                }
            });
        }

        // 自动运行测试
        window.onload = function() {
            testAPIClass();
        };
    </script>
</body>
</html>
