name: CI - Inty 后端

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "!**/*.md"

  pull_request:
    branches:
      - main
    paths:
      - "pytest.ini"
      - "start.sh"
      - "app/**/*.py"
      - "requirements.txt"
      - "scripts/"
      - "tests/**/*.py"
      - "tests/alembic/test_custom_config.sh"
      - "tests/requirements.txt"
      # Alembic files
      - "alembic/**/*"
      - "alembic.ini"
      # 这个是测试用配置文件
      - "devops/config.yaml.test"
      # 工作流文件
      - ".github/workflows/ci_backend.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PG_USER: postgres
  PG_PASSWORD: sxwl666!
  PG_DB: inty

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pgsql:
        # Cannot access env var here. So use hardcoded image.
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
          # This does not seem to work: https://github.com/actions/setup-python/issues/330
          # Keep for posterity, we do want to use this such that we do not need to manage cache ourselves.
          # cache: 'pip'

      # Cache pip packages for faster installs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache virtual environment
      # Based on https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/
      - uses: actions/cache@v4
        with:
          path: .venv
          # Unique key for the cache
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Install dependencies
        run: |
          # Create venv only if it doesn't exist (cache miss)
          if [ ! -d .venv ]; then
            python -m venv .venv
          fi
          source .venv/bin/activate
          # Upgrade pip to latest version for better caching
          python -m pip install --upgrade pip
          # Install dependencies (pip will use cached packages if available)
          python -m pip install -r requirements.txt
          python -m pip install -r tests/requirements.txt
          # https://stackoverflow.com/a/74669486
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
      - name: Run alembic tests
        run: |
          ./tests/alembic/test_custom_config.sh
        env:
          PYTHONPATH: .
      - name: Run python tests
        run: |
          cp devops/config.yaml.test config.yaml
          # alembic upgrade head: no need to run, as start.sh already includes it
          ./start.sh --dev &

          # Wait for the server to be ready with better retry logic
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8000 > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i: Server not ready yet, waiting..."
            sleep 2
          done

          # Final check with verbose output
          curl --verbose --fail http://localhost:8000

          # noci marker is defined in pytest.ini
          # applied on test functions with noci marker will be skipped on CI
          pytest -m "not noci" -v -s tests/
