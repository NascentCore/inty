name: CI - Inty 后端

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pytest.ini"
      - "backend/inty/start.sh"
      - "app/**/*.py"
      - "requirements.txt"
      - "scripts/"
      - "tests/**/*.py"
      - "tests/alembic/test_custom_config.sh"
      - "tests/requirements.txt"
      - "backend/push_worker/**"
      # Alembic files
      - "alembic/**/*"
      # 这个是测试用配置文件
      - "devops/config.yaml.test"
      # 工作流文件
      - ".github/workflows/ci_backend.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "pytest.ini"
      - "backend/inty/start.sh"
      - "app/**/*.py"
      - "requirements.txt"
      - "scripts/"
      - "tests/**/*.py"
      - "tests/alembic/test_custom_config.sh"
      - "tests/requirements.txt"
      - "backend/push_worker/**"
      # Alembic files
      - "alembic/**/*"
      # 这个是测试用配置文件
      - "devops/config.yaml.test"
      # 工作流文件
      - ".github/workflows/ci_backend.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PG_USER: postgres
  PG_PASSWORD: sxwl666!
  PG_DB: inty

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pgsql:
        # Cannot access env var here. So use hardcoded image.
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
          # This does not seem to work: https://github.com/actions/setup-python/issues/330
          # Keep for posterity, we do want to use this such that we do not need to manage cache ourselves.
          # cache: 'pip'

      # Cache pip packages for faster installs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt', 'tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache virtual environment
      # Based on https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/
      - uses: actions/cache@v4
        with:
          path: .venv
          # Unique key for the cache
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Install dependencies
        run: |
          # Create venv only if it doesn't exist (cache miss)
          if [ ! -d .venv ]; then
            python -m venv .venv
          fi
          source .venv/bin/activate
          # Upgrade pip to latest version for better caching
          python -m pip install --upgrade pip
          # Install dependencies (pip will use cached packages if available)
          python -m pip install -r requirements.txt
          python -m pip install -r tests/requirements.txt
          # https://stackoverflow.com/a/74669486
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Check architecture layer boundaries
        run: |
          python scripts/check_layer_dependencies.py

      - name: Ensure single alembic head
        run: |
          export PYTHONPATH=.
          export ALEMBIC_CONFIG=alembic/alembic.ini
          heads_count=$(python -m alembic heads | wc -l)
          if [ "$heads_count" -ne 1 ]; then
            echo "Expected exactly one alembic head, got $heads_count:"
            python -m alembic heads
            exit 1
          fi

      - name: Run alembic tests
        run: |
          ./tests/alembic/test_custom_config.sh
        env:
          PYTHONPATH: .
      - name: Run python tests
        run: |
          cp devops/config.yaml.test config.yaml
          # alembic upgrade head: no need to run, as backend/inty/start.sh already includes it
          ./backend/inty/start.sh --test 2>&1 | tee inty_backend.log &

          # Wait for the server to be ready with better retry logic
          echo "Waiting for server to start..."
          for i in {1..30}; do
            if curl -s http://localhost:8000 > /dev/null 2>&1; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i: Server not ready yet, waiting..."
            sleep 2
          done

          # Final check with verbose output
          curl --verbose --fail http://localhost:8000

          # noci marker is defined in pytest.ini
          # applied on test functions with noci marker will be skipped on CI
          set +e
          python -m pytest -m "not noci" -v -s tests/ --capture=fd --show-capture=no
          pytest_exit=$?
          python scripts/check_ci_backend_logs.py inty_backend.log --context-name "Inty backend test server"
          log_scan_exit=$?
          set -e
          if [ "$pytest_exit" -ne 0 ]; then
            exit "$pytest_exit"
          fi
          exit "$log_scan_exit"
        env:
          INTY_LOGGING_LEVEL: INFO
          INTY_CONSOLE_LOGGING_LEVEL: INFO
          UVICORN_LOG_LEVEL: warning

      - name: Start push worker and verify startup
        run: |
          cp devops/config.yaml.test config.yaml
          ./backend/push_worker/start.sh 2>&1 | tee push_worker.log &

          # Wait for the push worker to be ready (same pattern as main server readiness loop)
          echo "Waiting for push worker to start..."
          for i in {1..30}; do
            if grep -q -E "推送服务初始化完成|推送服务启动成功|推送服务未启用" push_worker.log 2>/dev/null; then
              echo "Push worker is ready!"
              break
            fi
            echo "Attempt $i: Push worker not ready yet, waiting..."
            sleep 2
          done

          # Final check: at least one of the expected messages must appear
          grep -q -E "推送服务初始化完成|推送服务启动成功|推送服务未启用" push_worker.log
