name: CI - Evaluation

on:
  pull_request:
    branches:
      - main
    paths:
      - evaluation/**
      - .github/workflows/ci_eval.yaml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            evaluation/inty_sdk/node_modules
          key: ${{ runner.os }}-evaluation-yarn-${{ hashFiles('evaluation/inty_sdk/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-evaluation-yarn-

      - name: Install and build inty SDK
        working-directory: evaluation/inty_sdk
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-evaluation-npm-${{ hashFiles('evaluation/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-evaluation-npm-

      - name: Install evaluation dependencies
        working-directory: evaluation
        run: npm ci

      - name: Run ESLint checks
        working-directory: evaluation
        run: npm run lint:check

      - name: Run TypeScript checks
        working-directory: evaluation
        run: npm run type-check

      - name: Run unit tests
        working-directory: evaluation
        run: npm run test
