name: Sync AI characters from dev to prod

on:
  schedule:
    # Run every day at 5 PM UTC, 2:00 AM Beijing time, 10:00 AM PST.
    - cron: '0 17 * * *'
  workflow_dispatch:

jobs:
  sync:
    # 这是部署在 Google Cloud VM 上的 github self-hosted runner。
    # 该 VM 能直接访问数据库。
    runs-on: inty-prod-server-gcp

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/sync_agents_dev_to_prod/requirements.txt
          python -m pip install -r requirements.txt

      - name: Sync AI characters from dev to prod
        env:
          PYTHONPATH: .
        run: |
          python scripts/sync_agents_dev_to_prod/sync_agents.py --config config.yaml.example
