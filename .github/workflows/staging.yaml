name: Build and release staging APK to GitHub Release

on:
  workflow_dispatch:
  schedule:
    # 18:00 UTC
    - cron: '0 18 * * *'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Create keystore.properties
      env:
        KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
      run: |
        echo "$KEYSTORE_PROPERTIES" > keystore.properties

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: |
        ./gradlew clean assembleRelease --stacktrace --info

    - name: Get version name and code
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
        GIT_COMMIT_COUNT=$(git rev-list --count HEAD)
        VERSION_CODE=$(( GIT_COMMIT_COUNT > 10 ? GIT_COMMIT_COUNT : 10 ))
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version_code }}
        release_name: APK Release v${{ steps.version.outputs.version_name }} (Build ${{ steps.version.outputs.version_code }})
        body: |
          🔧 APK Release Build

          - Version Name: ${{ steps.version.outputs.version_name }}
          - Version Code: ${{ steps.version.outputs.version_code }}
          - Built from commit: ${{ github.sha }}
        draft: false
        prerelease: false

    - name: Upload APK to GitHub Release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/apk/release/app-release.apk
        asset_name: app-release.apk
        asset_content_type: application/vnd.android.package-archive

    - name: Notify Feishu group
      run: |
        VERSION_NAME=${{ steps.version.outputs.version_name }}
        VERSION_CODE=${{ steps.version.outputs.version_code }}
        REPO=${{ github.repository }}
        RELEASE_TAG="v${VERSION_CODE}"
        APK_NAME="app-release.apk"
        RELEASE_URL="https://github.com/${REPO}/releases/download/${RELEASE_TAG}/${APK_NAME}"

        # 获取最近提交（格式化并转义换行）
        COMMITS=$(git log -n 5 --pretty=format:"- %s" | sed ':a;N;$!ba;s/\n/\\n/g')

        # 构建 JSON
        cat <<EOF > feishu_card.json
        {
          "msg_type": "interactive",
          "card": {
            "config": {
              "wide_screen_mode": true
            },
            "header": {
              "title": {
                "tag": "plain_text",
                "content": "📦 新版本 APK 发布"
              }
            },
            "elements": [
              {
                "tag": "div",
                "fields": [
                  {
                    "is_short": true,
                    "text": {
                      "tag": "lark_md",
                      "content": "**版本名称：** ${VERSION_NAME}"
                    }
                  },
                  {
                    "is_short": true,
                    "text": {
                      "tag": "lark_md",
                      "content": "**版本号：** ${VERSION_CODE}"
                    }
                  }
                ]
              },
              {
                "tag": "div",
                "text": {
                  "tag": "lark_md",
                  "content": "**更新内容：**\\n${COMMITS}"
                }
              },
              {
                "tag": "div",
                "text": {
                  "tag": "lark_md",
                  "content": "✅ APK 构建完成并上传至 [GitHub Release](${RELEASE_URL})"
                }
              }
            ]
          }
        }
        EOF

        curl -X POST ${{ secrets.FEISHU_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d @feishu_card.json