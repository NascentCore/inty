# The app is built with debug build type, and connects to dev backend
# at dev.inty.sxwl.ai.
name: Build and release staging APK to GitHub Release (app debug build + dev backend)

on:
  workflow_dispatch:
  schedule:
    # 18:00 UTC
    - cron: '0 18 * * *'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Create keystore.properties
      env:
        KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
      run: |
        echo "$KEYSTORE_PROPERTIES" > keystore.properties

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK
      run: |
        ./gradlew clean assembleDebug --stacktrace --info

    - id: gen-release-info
      run: |
        echo "name=v$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

    - id: create-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.gen-release-info.outputs.name }}
        draft: false
        prerelease: false
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        generate_release_notes: true
        make_latest: true
        fail_on_unmatched_files: false

    - name: Notify Feishu group
      run: |
        RELEASE_NAME=${{ steps.gen-release-info.outputs.name }}
        RELEASE_URL=${{ steps.create-release.outputs.url }}
        RELEASE_APK_URL=${{ fromJSON(steps.create-release.outputs.assets)[0].browser_download_url }}
        cat <<EOF > feishu_card.json
        {
          "msg_type": "interactive",
          "card": {
            "config": {
              "wide_screen_mode": true
            },
            "header": {
              "title": {
                "tag": "plain_text",
                "content": "开发用测试版本 APK 发布：$RELEASE_NAME"
              }
            },
            "elements": [
              {
                "tag": "div",
                "text": {
                  "tag": "lark_md",
                  "content": "✅ 改动列表见 [GitHub Release](${RELEASE_URL})"
                }
              },
              {
                "tag": "div",
                "text": {
                  "tag": "lark_md",
                  "content": "📦 [APK 下载链接](${RELEASE_APK_URL})"
                }
              }
            ]
          }
        }
        EOF
        curl -X POST ${{ secrets.FEISHU_WEBHOOK_URL }} \
          -H "Content-Type: application/json" \
          -d @feishu_card.json
