# Generate the SDK in this repo
# * Using openapi generator
# Generating it in the separate repo
# * Using stainless to generate
name: Generate Kotlin SDK (Simple)

on:
  # push:
  #   branches:
  #     - main
  #   paths:
  #     - "app/**/*.py"

  workflow_dispatch:

env:
  OPENAPI_GENERATOR_VERSION: 7.2.0

jobs:
  generate-sdk:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Download OpenAPI Generator
      run: |
        wget https://repo1.maven.org/maven2/org/openapitools/openapi-generator-cli/${{ env.OPENAPI_GENERATOR_VERSION }}/openapi-generator-cli-${{ env.OPENAPI_GENERATOR_VERSION }}.jar -O openapi-generator-cli.jar

    - name: Start backend server
      run: |
        docker compose -f docker_compose.yaml up -d
        # Wait for backend server to start
        sleep 10

    - name: Download OpenAPI spec
      run: |
        curl -o openapi.json http://localhost:8000/openapi.json

    - name: Generate version
      id: version
      run: |
        echo "version=$(date +%Y.%m.%d)" >> $GITHUB_OUTPUT

    - name: Generate Kotlin SDK
      run: |
        java -jar openapi-generator-cli.jar generate \
          -i openapi.json \
          -g kotlin \
          -o sdk-repo \
          --additional-properties=library=jvm-retrofit2 \
          --additional-properties=serializationLibrary=gson \
          --additional-properties=useCoroutines=true \
          --additional-properties=dateLibrary=java8 \
          --additional-properties=collectionType=list \
          --additional-properties=packageName=com.nascentcore.inty \
          --additional-properties=artifactId=inty-kotlin-sdk \
          --additional-properties=artifactVersion=${{ steps.version.outputs.version }} \
          --additional-properties=groupId=com.nascentcore \
          --additional-properties=useRxJava3=false \
          --additional-properties=useResponseAsReturnType=true

    - name: Setup Kotlin build
      working-directory: sdk-repo
      run: |
        cat > build.gradle.kts << 'EOF'
        plugins {
            kotlin("jvm") version "1.9.0"
            `java-library`
        }
        
        group = "com.nascentcore"
        version = "${{ steps.version.outputs.version }}"
        
        repositories {
            mavenCentral()
        }
        
        dependencies {
            implementation("com.squareup.retrofit2:retrofit:2.9.0")
            implementation("com.squareup.retrofit2:converter-gson:2.9.0")
            implementation("com.squareup.okhttp3:okhttp:4.11.0")
            implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3")
            implementation("com.google.code.gson:gson:2.10.1")
            
            testImplementation("junit:junit:4.13.2")
            testImplementation("org.jetbrains.kotlin:kotlin-test")
        }
        EOF

    - name: Create README
      working-directory: sdk-repo
      run: |
        cat > README.md << 'EOF'
        # Inty Kotlin SDK

        Auto-generated Kotlin SDK for the Inty Backend API.

        ## Installation

        Clone this repository and include it in your project:

        ```kotlin
        // In your build.gradle.kts
        dependencies {
            implementation(files("path/to/inty-kotlin-sdk/build/libs/inty-kotlin-sdk-${{ steps.version.outputs.version }}.jar"))
        }
        ```

        ## Usage

        ```kotlin
        import com.nascentcore.inty.api.DefaultApi
        import com.nascentcore.inty.ApiClient

        val apiClient = ApiClient()
        apiClient.setBearerToken("your-token-here")

        val api = DefaultApi(apiClient)

        // Example: Get user profile
        runBlocking {
            try {
                val user = api.getUserProfile()
                println("User: ${user.name}")
            } catch (e: Exception) {
                println("Error: ${e.message}")
            }
        }
        ```

        ## Features

        - Auto-generated from OpenAPI specification
        - Retrofit2 for HTTP requests
        - Kotlin Coroutines support
        - GSON serialization
        - Bearer token authentication

        ## Version

        Current version: ${{ steps.version.outputs.version }}

        Generated on: $(date)
        EOF

    - name: Build SDK
      working-directory: sdk-repo
      run: |
        ./gradlew build

    - name: Commit and push changes
      working-directory: sdk-repo
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Auto-generate SDK v${{ steps.version.outputs.version }}" || exit 0
        git push origin main

    - name: Create Release
      working-directory: sdk-repo
      run: |
        git tag -a v${{ steps.version.outputs.version }} -m "Release v${{ steps.version.outputs.version }}"
        git push origin v${{ steps.version.outputs.version }} 
