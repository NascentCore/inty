name: Release - Inty Ops 平台

on:
  push:
    branches:
      - main
    paths:
      # 不含 devops/config.yaml.imate_*：push 默认只部署 dev，避免仅改 iMate 配置却重部署 IntelliMate inty-ops-dev
      - "app/**/*.py"
      - "backend/alembic/**/*.py"
      - "backend/ops/**"
      - "devops/config.yaml.dev"
      - "evaluation/**/*.tsx"
      - "evaluation/**/*.ts"
      - "evaluation/tsconfig.json"
      - "evaluation/tsconfig.node.json"
      - "evaluation/package.json"
      - "evaluation/package-lock.json"
      - "evaluation/vite.config.ts"
      - "evaluation/vitest.config.ts"
      - "evaluation/index.html"
      - "evaluation/build.sh"
      - "devops/docker/Dockerfile.ops"
      - ".github/workflows/build_and_deploy_ops.yml"
      - "tools/scripts/inty_backend_smoke_tests/**"

  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: The environment to deploy to
        required: true
        default: dev

  # schedule:
  #   - cron: "0 11 * * *"

concurrency:
  group: inty-deploy-ops-${{ inputs.environment || (github.event_name == 'schedule' && 'prod') || 'dev' }}
  cancel-in-progress: true

env:
  INTY_OPS_IMAGE: ghcr.io/nascentcore/inty-backend/inty-ops

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'

    permissions:
      packages: write
      contents: write

    environment: ${{ inputs.environment || (github.event_name == 'schedule' && 'prod') || 'dev' }}

    steps:
      - id: prep
        run: |
          echo "environment=${{ inputs.environment || (github.event_name == 'schedule' && 'prod') || 'dev' }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.ref_name }}-${{ inputs.environment || (github.event_name == 'schedule' && 'prod') || 'dev' }}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Check prep output
        run: |
          echo "environment=${{ steps.prep.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "image_tag=${{ steps.prep.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY

      - id: map
        run: |
          case "${{ steps.prep.outputs.environment }}" in
            dev)
              echo "config_file=devops/config.yaml.dev" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "config_file=devops/config.yaml.prod" >> $GITHUB_OUTPUT
              ;;
            imate-dev)
              echo "config_file=devops/config.yaml.imate_dev" >> $GITHUB_OUTPUT
              ;;
            imate-prod)
              echo "config_file=devops/config.yaml.imate_prod" >> $GITHUB_OUTPUT
              ;;
            imate)
              echo "config_file=devops/config.yaml.imate" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unsupported environment: ${{ steps.prep.outputs.environment }}"
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      - id: build-docker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./devops/docker/Dockerfile.ops
          push: true
          tags: ${{ env.INTY_OPS_IMAGE }}:${{ steps.prep.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CONFIG_FILE=${{ steps.map.outputs.config_file }}
            INTY_VCS_REVISION=${{ github.sha }}
            INTY_BUILD_TIME=${{ steps.prep.outputs.build_time }}

      - name: Pull deployment image
        uses: appleboy/ssh-action@v1.2.5
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            sudo docker pull ${{ env.INTY_OPS_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}

      - name: Deploy ops to ${{ steps.prep.outputs.environment }}
        uses: appleboy/ssh-action@v1.2.5
        timeout-minutes: 30
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo docker stop inty-ops-${{ steps.prep.outputs.environment }} || true
            sudo docker rm inty-ops-${{ steps.prep.outputs.environment }} || true
            sudo docker run --detach --log-driver=gcplogs \
              --name inty-ops-${{ steps.prep.outputs.environment }} \
              --restart unless-stopped \
              --publish ${{ vars.OPS_SERVICE_PORT_ON_HOST }}:8001 \
              --env LANGCHAIN_TRACING_V2=true \
              --env LANGCHAIN_PROJECT=inty-ops-${{ steps.prep.outputs.environment }} \
              --env LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
              --label application=inty-ops \
              --label environment=${{ steps.prep.outputs.environment }} \
              --log-opt labels=application,environment \
              --volume /opt/inty-${{ steps.prep.outputs.environment }}/inty-backend-key.json:/inty-backend-key.json \
              --volume /opt/inty-${{ steps.prep.outputs.environment }}/inty-firebase-key.json:/inty-firebase-key.json \
              ${{ env.INTY_OPS_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}
            echo "Waiting for HTTP readiness on 127.0.0.1:${{ vars.OPS_SERVICE_PORT_ON_HOST }} ..."
            n=0
            max_wait=600
            while ! curl -sfS --max-time 3 "http://127.0.0.1:${{ vars.OPS_SERVICE_PORT_ON_HOST }}/health" >/dev/null
            do
              n=$((n + 1))
              if [ "$n" -ge "$max_wait" ]; then
                echo "Timeout after ${max_wait}s waiting for GET /health on published port"
                sudo docker logs inty-ops-${{ steps.prep.outputs.environment }} 2>&1 | tail -n 120
                exit 1
              fi
              sleep 1
            done
            echo "Ops responded on localhost /health; startup complete."

      - name: Sanity check (HTTP)
        env:
          OPS_URL: ${{ vars.OPS_SERVICE_PUBLIC_URL }}
        run: |
          base="$(printf '%s' "$OPS_URL" | tr -d '\r\n' | sed 's#/*$##')"
          curl --verbose --fail --retry 5 --retry-delay 5 "${base}/health"

      - name: Sanity check (WebSocket ping)
        env:
          OPS_URL: ${{ vars.OPS_SERVICE_PUBLIC_URL }}
          INTY_BEARER_TOKEN: ${{ secrets.OPS_DEPLOY_SMOKE_BEARER_TOKEN }}
        run: |
          base="$(printf '%s' "$OPS_URL" | tr -d '\r\n' | sed 's#/*$##')"
          if [ -z "${INTY_BEARER_TOKEN}" ]; then
            echo "::error::Set secret OPS_DEPLOY_SMOKE_BEARER_TOKEN on GitHub Environment '${{ steps.prep.outputs.environment }}' (long-lived JWT for /api/v1/chat/ws ping/pong deploy gate)."
            exit 1
          fi
          python3 -m pip install -q -r tools/scripts/inty_backend_smoke_tests/requirements.txt
          export INTY_API_BASE_URL="$base"
          python3 tools/scripts/inty_backend_smoke_tests/test_chat_ws.py --ping-only

      - name: Write summary
        run: |
          echo "## Build and deploy ops"
          echo "GitHub ref: ${{ github.ref }}"
          echo "Deployed to ${{ steps.prep.outputs.environment }} for ${{ vars.OPS_SERVICE_PUBLIC_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "Ops image: ${{ env.INTY_OPS_IMAGE }}:${{ steps.prep.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
