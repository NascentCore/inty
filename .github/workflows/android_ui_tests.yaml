name: Android UI Tests

# TODO: 此工作流当前仍不稳定（模拟器在 GitHub Actions 上偶发启动失败/超时），
# 后续需增加重试/更高超时与缓存策略，或迁移到自托管 Runner。

on:
  workflow_dispatch:

jobs:
  connected-tests:
    name: Run Scripted UI Test on Emulator
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android_app/.gradle
          key: ${{ runner.os }}-gradle-ui-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-ui-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-

      - name: Ensure Gradle wrapper executable
        run: chmod +x android_app/gradlew

      - name: Run UI tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          script: |
            cd android_app
            ./gradlew :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.ai.intellimate.ScriptedClickTest \
              --stacktrace --info
