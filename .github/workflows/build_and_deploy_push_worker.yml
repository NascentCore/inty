name: Build and deploy Inty push worker

on:
  push:
    branches:
      - main
    paths:
      # 推送服务代码
      - "app/services/push_*.py"
      - "app/services/push_worker.py"
      # 开发环境配置文件
      - "devops/config.yaml.dev"
      - "devops/config.yaml.prod"
      # Dockerfile 和启动脚本
      - "Dockerfile.push-worker"
      - "start_push_worker.sh"
      # Workflow 文件本身
      - ".github/workflows/build_and_deploy_push_worker.yml"

  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: The environment to deploy to
        required: true
        default: dev

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'dev' }}
  # Do not cancel in-progress builds.
  cancel-in-progress: false

env:
  INTY_PUSH_WORKER_IMAGE: ghcr.io/nascentcore/inty-backend/inty-push-worker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      # Push to ghcr.io
      packages: write
      # Checkout repository
      contents: read

    # 自动运行的情况下，inputs.environment 为空，因此需要额外设置
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - id: set-environment
        run: |
          echo "environment=${{ inputs.environment || 'dev' }}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      - id: build-docker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.push-worker
          push: true
          tags: ${{ env.INTY_PUSH_WORKER_IMAGE }}:${{ github.ref_name }}-${{ steps.set-environment.outputs.environment }}
          # https://docs.docker.com/build/ci/github-actions/cache/#cache-backend-api
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CONFIG_FILE=devops/config.yaml.${{ steps.set-environment.outputs.environment }}

      - name: Deploy to ${{ steps.set-environment.outputs.environment }}
        uses: appleboy/ssh-action@master
        # 这个限制这一步最长时间，同时内部有一个等待的循环，从而保证不会超时。
        timeout-minutes: 2
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            sudo docker pull ${{ env.INTY_PUSH_WORKER_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}
            sudo docker stop inty-push-worker-${{ steps.set-environment.outputs.environment }} || true
            sudo docker rm inty-push-worker-${{ steps.set-environment.outputs.environment }} || true
            # log-driver: https://docs.docker.com/engine/logging/drivers/gcplogs/
            #   运行于 gcp 环境，docker engine 探测 gcp 环境信息，相关设置都自动提取
            #   https://docs.docker.com/engine/logging/drivers/gcplogs/#gcplogs-options
            # LANGCHAIN_* 相关环境变量应该不需要设置，已经在代码中强制设置，以后考虑清理
            # https://github.com/NascentCore/inty/blob/ef9c9735c62a9cb2d6be4b2414bebed410f1ff56/app/core/config.py#L267
            sudo docker run --detach --log-driver=gcplogs \
              --name inty-push-worker-${{ steps.set-environment.outputs.environment }} \
              --restart unless-stopped \
              --env LANGCHAIN_TRACING_V2=true \
              --env LANGCHAIN_PROJECT=inty-push-worker-${{ steps.set-environment.outputs.environment }} \
              --env LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
              --label application=inty-push-worker \
              --label environment=${{ steps.set-environment.outputs.environment }} \
              --log-opt labels=application,environment \
              --volume /opt/inty-${{ steps.set-environment.outputs.environment }}/inty-backend-key.json:/inty-backend-key.json \
              --volume /opt/inty-${{ steps.set-environment.outputs.environment }}/inty-firebase-key.json:/inty-firebase-key.json \
              ${{ env.INTY_PUSH_WORKER_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}
            echo "Waiting for push worker service startup..."
            sleep 5
            # 检查容器是否正在运行
            if sudo docker ps | grep -q "inty-push-worker-${{ steps.set-environment.outputs.environment }}"; then
              echo "Push worker service started successfully!"
              # 检查日志中是否有初始化成功的消息
              if sudo docker logs inty-push-worker-${{ steps.set-environment.outputs.environment }} 2>&1 | grep -q "推送服务初始化完成\|推送服务启动成功"; then
                echo "Push worker service initialized successfully!"
              else
                echo "Warning: Push worker service is running but initialization message not found in logs"
              fi
            else
              echo "Error: Push worker service failed to start"
              sudo docker logs inty-push-worker-${{ steps.set-environment.outputs.environment }} 2>&1 || true
              exit 1
            fi

      - name: Write summary
        run: |
          echo "## Build and deploy push worker" >> $GITHUB_STEP_SUMMARY
          echo "GitHub ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to ${{ steps.set-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "Image: ${{ env.INTY_PUSH_WORKER_IMAGE }}:${{ github.ref_name }}-${{ steps.set-environment.outputs.environment }}" >> $GITHUB_STEP_SUMMARY

