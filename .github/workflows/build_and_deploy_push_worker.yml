# CREATED_BY_AGENT
name: Release - Inty Push Worker

on:
  push:
    branches:
      - main
    paths:
      # 数据库版本变动
      - "alembic/**/*.py"
      # 后端代码
      - "app/**/*.py"
      - "backend/push_worker/*.py"
      - "backend/push_worker/start.sh"
      - "requirements.txt"
      # 运维部署
      - "devops/docker/Dockerfile.push-worker"
      - "devops/config.yaml.dev"
      - "devops/config.yaml.prod"
      # 本文件
      - ".github/workflows/build_and_deploy_push_worker.yml"
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: The environment to deploy to
        required: true
        default: dev

  schedule:
    # 美西凌晨 3 点 UTC（Pacific）：11 AM UTC = 3:00 PST（冬令时），夏令时期间为当地 4:00
    - cron: "0 11 * * *"

concurrency:
  group: inty-deploy-push-worker-${{ inputs.environment || (github.event_name == 'schedule' && 'prod') || 'dev' }}
  cancel-in-progress: false

env:
  INTY_PUSH_WORKER_IMAGE: ghcr.io/nascentcore/inty-backend/inty-push-worker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'

    permissions:
      packages: write
      contents: write

    # 自动运行的情况下，inputs.environment 为空；schedule 固定为 prod，push 为 dev
    environment: ${{ inputs.environment || (github.event_name == 'schedule' && 'prod') || 'dev' }}

    steps:
      - id: prep
        run: |
          echo "environment=${{ inputs.environment || (github.event_name == 'schedule' && 'prod') || 'dev' }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.ref_name }}-${{ inputs.environment || (github.event_name == 'schedule' && 'prod') || 'dev' }}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Check prep output
        run: |
          echo "environment=${{ steps.prep.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "image_tag=${{ steps.prep.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      - id: build-push-worker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./devops/docker/Dockerfile.push-worker
          push: true
          tags: ${{ env.INTY_PUSH_WORKER_IMAGE }}:${{ steps.prep.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CONFIG_FILE=devops/config.yaml.${{ steps.prep.outputs.environment }}
            INTY_VCS_REVISION=${{ github.sha }}
            INTY_BUILD_TIME=${{ steps.prep.outputs.build_time }}

      - name: Pull deployment image
        uses: appleboy/ssh-action@master
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            sudo docker pull ${{ env.INTY_PUSH_WORKER_IMAGE }}@${{ steps.build-push-worker-image.outputs.digest }}

      - name: Deploy push worker to ${{ steps.prep.outputs.environment }}
        uses: appleboy/ssh-action@master
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo docker stop inty-push-worker-${{ steps.prep.outputs.environment }} || true
            sudo docker rm inty-push-worker-${{ steps.prep.outputs.environment }} || true
            sudo docker run --detach --log-driver=gcplogs \
              --name inty-push-worker-${{ steps.prep.outputs.environment }} \
              --restart unless-stopped \
              --env LANGCHAIN_TRACING_V2=true \
              --env LANGCHAIN_PROJECT=inty-push-worker-${{ steps.prep.outputs.environment }} \
              --env LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
              --label application=inty-push-worker \
              --label environment=${{ steps.prep.outputs.environment }} \
              --log-opt labels=application,environment \
              --volume /opt/inty-${{ steps.prep.outputs.environment }}/inty-backend-key.json:/inty-backend-key.json \
              --volume /opt/inty-${{ steps.prep.outputs.environment }}/inty-firebase-key.json:/inty-firebase-key.json \
              ${{ env.INTY_PUSH_WORKER_IMAGE }}@${{ steps.build-push-worker-image.outputs.digest }}
            echo "Waiting for push worker service startup..."
            max_wait=30
            wait_interval=2
            elapsed=0
            container_started=false
            while [ $elapsed -lt $max_wait ]; do
              if sudo docker ps | grep -q "inty-push-worker-${{ steps.prep.outputs.environment }}"; then
                container_started=true
                echo "Push worker service container is running"
                break
              fi
              sleep $wait_interval
              elapsed=$((elapsed + wait_interval))
              echo "Waiting for container to start... (${elapsed}s/${max_wait}s)"
            done
            if [ "$container_started" = true ]; then
              echo "Push worker service started successfully!"
              log_check=$(sudo docker logs inty-push-worker-${{ steps.prep.outputs.environment }} 2>&1 | grep -q "推送服务初始化完成\|推送服务启动成功" && echo "found" || echo "not_found")
              if [ "$log_check" = "found" ]; then
                echo "Push worker service initialized successfully (found in logs)!"
              else
                echo "Note: Initialization message not found in docker logs (expected when using gcplogs driver)."
                echo "Service is running. Check Google Cloud Logging for detailed logs."
              fi
            else
              echo "Error: Push worker service failed to start within ${max_wait} seconds"
              echo "Container status:"
              sudo docker ps -a | grep "inty-push-worker-${{ steps.prep.outputs.environment }}" || echo "Container not found"
              echo "Attempting to get logs (may be empty with gcplogs):"
              sudo docker logs inty-push-worker-${{ steps.prep.outputs.environment }} 2>&1 || true
              exit 1
            fi

      - name: Write summary
        run: |
          echo "## Build and deploy push worker"
          echo "GitHub ref: ${{ github.ref }}"
          echo "Deployed to ${{ steps.prep.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "Push worker image: ${{ env.INTY_PUSH_WORKER_IMAGE }}:${{ steps.prep.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
