name: CI - Markdown

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - ".markdownlint-cli2.yaml"
      - "tools/markdownlint/package.json"
      - "tools/markdownlint/package-lock.json"
      - ".github/workflows/ci_markdown.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "**/*.md"
      - ".markdownlint.yaml"
      - ".markdownlint-cli2.yaml"
      - "tools/markdownlint/package.json"
      - "tools/markdownlint/package-lock.json"
      - ".github/workflows/ci_markdown.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/markdownlint/package-lock.json

      - name: Install markdownlint-cli2
        run: npm ci --prefix tools/markdownlint

      - name: Lint Markdown
        run: npx --prefix tools/markdownlint markdownlint-cli2
