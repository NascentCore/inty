name: Build and Deploy to Google Play Internal Testing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      track:
        description: 'Release track (internal, alpha, beta, production)'
        required: true
        default: 'internal'
        type: choice
        options:
        - internal
        - alpha
        - beta
        - production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Create keystore.properties
      env:
        KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
      run: |
        echo "$KEYSTORE_PROPERTIES" > keystore.properties

    - name: Create Google Play service account key
      env:
        GOOGLE_PLAY_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
      run: |
        echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_KEY" > service-account-key.json

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Use working build configuration for CI
      run: |
        # 直接使用不依赖Google Services的简化版本进行构建
        cat > build.gradle.kts << 'EOF'
        // Top-level build file where you can add configuration options common to all sub-projects/modules.
        plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.android) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.the.router) apply false
            alias(libs.plugins.android.library) apply false
        }
        EOF
        
        # 同样简化app/build.gradle.kts中的Google Services引用
        sed -i '/alias(libs.plugins.google.services)/d' app/build.gradle.kts
        sed -i '/alias(libs.plugins.firebase.crashlytics)/d' app/build.gradle.kts  
        sed -i '/alias(libs.plugins.firebase.perf)/d' app/build.gradle.kts
        sed -i '/id("com.google.gms.google-services")/d' app/build.gradle.kts
        sed -i '/id("com.google.firebase.crashlytics")/d' app/build.gradle.kts
        sed -i '/id("com.google.firebase.firebase-perf")/d' app/build.gradle.kts
        
        echo "Simplified build configuration for CI:"
        cat build.gradle.kts

    - name: Build Release AAB
      run: ./gradlew clean bundleRelease

    - name: Extract version info
      id: version_info
      run: |
        # 直接计算版本信息，避免Gradle任务的复杂输出
        echo "🔍 Calculating version information..."
        
        # CI环境下使用Git提交数量作为版本号
        GIT_COMMIT_COUNT=$(git rev-list --count HEAD)
        VERSION_CODE=$(( GIT_COMMIT_COUNT > 10 ? GIT_COMMIT_COUNT : 10 ))
        
        # 从app/build.gradle.kts中提取版本名称
        VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)".*/\1/')
        
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "✅ Version Code: $VERSION_CODE, Version Name: $VERSION_NAME"

    - name: Generate dynamic release notes
      run: |
        mkdir -p distribution/whatsnew-dynamic
        
        # 获取版本信息
        VERSION_CODE=${{ steps.version_info.outputs.version_code }}
        VERSION_NAME=${{ steps.version_info.outputs.version_name }}
        
        # 获取最近的变更日志（从上个标签到现在的提交）
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          # 标签触发：获取标签信息和从上个标签的变更
          TAG_NAME=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [[ -n "$PREV_TAG" ]]; then
            COMMITS=$(git log --oneline ${PREV_TAG}..HEAD --pretty=format:"• %s" | head -5)
          else
            COMMITS=$(git log --oneline HEAD~5..HEAD --pretty=format:"• %s")
          fi
          
          RELEASE_HEADER="🚀 版本 $TAG_NAME (构建 $VERSION_CODE)"
          EN_HEADER="🚀 Release $TAG_NAME (Build $VERSION_CODE)"
        else
          # 手动触发：获取最近的提交
          COMMITS=$(git log --oneline HEAD~3..HEAD --pretty=format:"• %s")
          RELEASE_HEADER="📱 版本 $VERSION_NAME (构建 $VERSION_CODE)"
          EN_HEADER="📱 Version $VERSION_NAME (Build $VERSION_CODE)"
        fi
        
        # 如果没有提交信息，使用默认内容
        if [[ -z "$COMMITS" ]]; then
          COMMITS="• 性能优化和错误修复"
        fi
        
        # 生成中文发布说明
        cat > distribution/whatsnew-dynamic/whatsnew-zh-CN << EOF
        $RELEASE_HEADER
        
        本次更新内容：
        $COMMITS
        
        ✨ 持续改进用户体验
        🔧 修复已知问题
        EOF
        
        # 生成英文发布说明  
        EN_COMMITS=$(echo "$COMMITS" | sed 's/• /• /' | head -5)
        cat > distribution/whatsnew-dynamic/whatsnew-en-US << EOF
        $EN_HEADER
        
        What's new:
        $EN_COMMITS
        
        ✨ Enhanced user experience
        🔧 Bug fixes and improvements
        EOF
        
        echo "🎯 Generated release notes for version $VERSION_CODE:"
        echo "--- 中文版 ---"
        cat distribution/whatsnew-dynamic/whatsnew-zh-CN
        echo ""
        echo "--- English ---"
        cat distribution/whatsnew-dynamic/whatsnew-en-US

    - name: Upload AAB to Google Play Internal Testing
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_KEY }}
        packageName: com.ai.intellimate
        releaseFiles: app/build/outputs/bundle/release/app-release.aab
        track: ${{ github.event.inputs.track || 'internal' }}
        status: completed
        inAppUpdatePriority: 2
        userFraction: 1.0
        whatsNewDirectory: distribution/whatsnew-dynamic

    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/app-release.aab

    - name: Upload mapping artifact
      uses: actions/upload-artifact@v4  
      with:
        name: app-release-mapping
        path: app/build/outputs/mapping/release/mapping.txt

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          Changes in this Release:
          - AAB uploaded to Google Play Internal Testing
          - Built from commit: ${{ github.sha }}
        draft: false
        prerelease: false

    - name: Upload AAB to GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: app/build/outputs/bundle/release/app-release.aab
        asset_name: app-release.aab
        asset_content_type: application/octet-stream
