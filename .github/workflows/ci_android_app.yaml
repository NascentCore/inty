name: CI - IntelliMate Android App

# TODOs:
# - [ ] 自动化模块映射：ci_android_app.yaml 的测试任务解析依赖手工 case，新建模块会被漏测。重写为基于 settings.gradle.kts/gradlew projects 的映射，并在无法匹配时回退到执行完整 ./gradlew testDebugUnitTest。
# - [ ] 优化 Gradle 缓存策略：停止缓存 android_app/**/build 目录，切换到 gradle/actions/setup-gradle@v3 或最小化到 ~/.gradle/{caches,wrapper} 与 android_app/.gradle，避免缓存污染与浪费配额。
# - [ ] 补充静态检查任务：在 CI 中追加 lintDebug、detekt/ktlint 或等价 ./gradlew check，并把这些 job 设为 PR 必须通过，提前拦截资源、Compose、风格类问题。

on:
  push:
    branches:
      - main
    paths:
      - "android_app/**/*.kt"
      - "android_app/**/*.kts"
      - "android_app/**/*.java"
      - "android_app/**/*.xml"
      - "android_app/**/*.pro"
      - "android_app/**/*.gradle*"
      - "android_app/gradle/**"
      - "android_app/**/gradle.properties"
      - "android_app/gradlew"
      - ".github/workflows/ci_android_app.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "android_app/**/*.kt"
      - "android_app/**/*.kts"
      - "android_app/**/*.java"
      - "android_app/**/*.xml"
      - "android_app/**/*.pro"
      - "android_app/**/*.gradle*"
      - "android_app/gradle/**"
      - "android_app/**/gradle.properties"
      - "android_app/gradlew"
      - ".github/workflows/ci_android_app.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # runs-on: ubuntu-latest
    # 8c16g max concurrency 3
    runs-on: android-builder

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android_app/.gradle
            android_app/build
            android_app/app/build
            android_app/core/common/build
            android_app/core/data/build
            android_app/core/design/build
            android_app/core/firebase/build
            android_app/library/network/build
            android_app/library/utils/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-

      - name: Compute affected test tasks
        id: compute
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            BASE="origin/$BASE_REF"
          else
            BASE="${{ github.event.before }}"
            # 尝试拉取 before 提交，避免浅克隆导致缺失
            if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
              git fetch --no-tags --depth=1 origin "$BASE" || true
            fi
            # 兜底：找不到 before 时与上一个提交比较
            if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE=$(git rev-parse HEAD^ || echo "")
            fi
          fi
          echo "BASE=$BASE"
          CHANGED_FILES=$(git diff --name-only "$BASE" "${{ github.sha }}" | tr -d '\r')
          echo "Changed files:" && echo "$CHANGED_FILES"

          run_all=false
          TASKS=""
          TEST_PATTERNS=""
          ONLY_TEST_CHANGES=true
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              android_app/settings.gradle.kts|android_app/gradle/*|android_app/gradle/*/*|android_app/build-logic/*|android_app/*/build.gradle.kts|android_app/*/*/build.gradle.kts|android_app/*/gradle.properties|android_app/*/*/gradle.properties)
                run_all=true ;;
              android_app/app/*|android_app/app/*/*|android_app/app/*/*/*)
                TASKS="$TASKS :app:testDebugUnitTest" ;;
              android_app/core/common/*|android_app/core/common/*/*|android_app/core/common/*/*/*)
                TASKS="$TASKS :core:common:testDebugUnitTest :app:testDebugUnitTest" ;;
              android_app/core/data/*|android_app/core/data/*/*|android_app/core/data/*/*/*)
                TASKS="$TASKS :core:data:testDebugUnitTest :core:common:testDebugUnitTest :app:testDebugUnitTest" ;;
              android_app/core/design/*|android_app/core/design/*/*|android_app/core/design/*/*/*)
                TASKS="$TASKS :core:design:testDebugUnitTest :core:common:testDebugUnitTest :app:testDebugUnitTest" ;;
              android_app/core/firebase/*|android_app/core/firebase/*/*|android_app/core/firebase/*/*/*)
                TASKS="$TASKS :core:firebase:testDebugUnitTest :core:common:testDebugUnitTest :core:data:testDebugUnitTest :app:testDebugUnitTest" ;;
              android_app/library/utils/*|android_app/library/utils/*/*|android_app/library/utils/*/*/*)
                TASKS="$TASKS :library:utils:testDebugUnitTest :core:design:testDebugUnitTest :core:firebase:testDebugUnitTest :core:data:testDebugUnitTest :core:common:testDebugUnitTest :app:testDebugUnitTest" ;;
              android_app/library/network/*|android_app/library/network/*/*|android_app/library/network/*/*/*)
                TASKS="$TASKS :library:network:testDebugUnitTest :core:data:testDebugUnitTest :core:common:testDebugUnitTest :app:testDebugUnitTest" ;;
            esac

            # 收集测试类过滤器（仅 src/test 下的 .kt/.java，任意深度）
            if [[ "$file" == android_app/* && "$file" == *"/src/test/"* && ( "$file" == *.kt || "$file" == *.java ) ]]; then
              # 解析包名模式：从 src/test/{java,kotlin}/ 之后的路径转换为 FQCN
              rel=${file#android_app/}
              rel=${rel#*/src/test/}
              rel=${rel#java/}
              rel=${rel#kotlin/}
              class=${rel%.*}
              class=${class//\//.}
              TEST_PATTERNS="$TEST_PATTERNS $class"
            else
              # 不是测试文件，标记存在业务代码改动
              case "$file" in
                android_app/*/src/*) # 除 test 目录以外的源码改动
                  if [[ "$file" != *"/src/test/"* ]]; then
                    ONLY_TEST_CHANGES=false
                  fi
                  ;;
              esac
            fi
          done <<< "$CHANGED_FILES"

          if $run_all; then
            TASKS=":app:testDebugUnitTest :core:common:testDebugUnitTest :core:data:testDebugUnitTest :core:design:testDebugUnitTest :core:firebase:testDebugUnitTest :library:utils:testDebugUnitTest :library:network:testDebugUnitTest"
          fi

          TASKS=$(echo "$TASKS" | xargs -n1 | sort -u | xargs)
          TEST_PATTERNS=$(echo "$TEST_PATTERNS" | xargs -n1 | sort -u | xargs)
          echo "tasks=$TASKS" >> "$GITHUB_OUTPUT"
          echo "tests=$TEST_PATTERNS" >> "$GITHUB_OUTPUT"
          echo "only_test_changes=$ONLY_TEST_CHANGES" >> "$GITHUB_OUTPUT"
          echo "Computed tasks: $TASKS"
          echo "Computed test patterns: $TEST_PATTERNS"

      - name: Run affected unit tests (filtered changed tests only)
        if: steps.compute.outputs.tasks != '' && steps.compute.outputs.tests != '' && steps.compute.outputs.only_test_changes == 'true'
        run: |
          cd android_app
          # shellcheck disable=SC2086
          ./gradlew ${{ steps.compute.outputs.tasks }} $(for t in ${{ steps.compute.outputs.tests }}; do echo --tests "$t"; done)

      - name: Run affected unit tests (full for impacted modules)
        if: steps.compute.outputs.tasks != '' && (steps.compute.outputs.tests == '' || steps.compute.outputs.only_test_changes != 'true')
        run: |
          cd android_app
          ./gradlew ${{ steps.compute.outputs.tasks }}

      - name: No affected test tasks
        if: steps.compute.outputs.tasks == ''
        run: echo "No affected Android unit tests to run."
