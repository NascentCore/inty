name: Android App Tests

on:
  push:
    branches:
      - main
    paths:
      - 'android_app/**'

  pull_request:
    branches:
      - main
    paths:
      - 'android_app/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android_app/.gradle
            android_app/build
            android_app/app/build
            android_app/network/build
            android_app/utils/build
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-

      - name: Run unit tests
        run: |
          cd android_app
          ./gradlew testDebugUnitTest --stacktrace
