name: CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**/*.py"
      - "requirements.txt"
      - "test_requirements.txt"
      - ".github/workflows/ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**/*.py"
      - "requirements.txt"
      - "test_requirements.txt"
      - ".github/workflows/ci.yaml"

env:
  PG_USER: postgres
  PG_PASSWORD: sxwl666!
  PG_DB: inty

jobs:
  test:
    permissions:
      # 用于向 feature branch 提交改动
      contents: write

    runs-on: ubuntu-latest
    services:
      pgsql:
        # Cannot access env var here. So use hardcoded image.
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
          # This does not seem to work: https://github.com/actions/setup-python/issues/330
          # Keep for posterity, we do want to use this such that we do not need to manage cache ourselves.
          # cache: 'pip'

      # Based on https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/
      - uses: actions/cache@v4
        with:
          path: .venv
          # Unique key for the cache
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-
  
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt
          python -m pip install -r test_requirements.txt
          # https://stackoverflow.com/a/74669486
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Write config file
        run: |
          cp config.yaml.example config.yaml

      - name: Run python tests
        run: |
          # noci marker is defined in pytest.ini
          # applied on test functions with noci marker will be skipped on CI
          pytest tests/ -m "not noci" -v -s

      - name: Update openapi.json
        # Only run this step if triggered by a pull request
        # If we do this, then we do not need to run this again after pushing.
        if:
          github.event_name == 'pull_request'
        run: |
          # alembic upgrade head: no need to run, as start.sh already includes it
          ./start.sh &
          # Wait for the server to start. If the time is too short, it needs to be increased.
          sleep 10
          curl -o app/openapi.json http://localhost:8000/openapi.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit"
            exit 0
          fi
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          # Commit to the current feature branch of this pull request
          git add app/openapi.json
          git commit -m "Update openapi.json"
          git push origin HEAD
