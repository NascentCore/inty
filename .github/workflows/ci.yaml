name: CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**/*.py"
      - "requirements.txt"
      - "test_requirements.txt"
      - ".github/workflows/ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**/*.py"
      - "requirements.txt"
      - "test_requirements.txt"
      - ".github/workflows/ci.yaml"

env:
  PG_IMAGE: postgres:16
  PG_USER: postgres
  PG_PASSWORD: sxwl666!
  PG_DB: inty

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
          # This mihgt not be needed, test to remove it and see if venv still works.
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r test_requirements.txt

      - name: Populate config.yaml for Alembic
        run: |
          echo "database:" >> config.yaml
          echo "  db: ${{ env.PG_DB }}" >> config.yaml
          echo "  host: localhost" >> config.yaml
          echo "  password: ${{ env.PG_PASSWORD }}" >> config.yaml
          echo "  port: 5432" >> config.yaml
          echo "  user: postgres" >> config.yaml

      - name: Test Alembic versions
        run: |          
          alembic upgrade head

      - name: Run python tests
        run: |
          PYTHONPATH=$(pwd) pytest app/ -v --tb=short -s
