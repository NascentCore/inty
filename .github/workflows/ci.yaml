name: Python Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**/*.py"
      - "requirements.txt"
      - "test_requirements.txt"
      - ".github/workflows/ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "app/**/*.py"
      - "requirements.txt"
      - "test_requirements.txt"
      - ".github/workflows/ci.yaml"

env:
  PG_IMAGE: postgres:16
  PG_PASSWORD: sxwl666!
  PG_DB: inty

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pgsql:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
          cache: 'pip'

      # Based on https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/
      - uses: actions/cache@v4
        with:
          path: .venv
          # Unique key for the cache
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-
  
      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt
          python -m pip install -r test_requirements.txt
          # https://stackoverflow.com/a/74669486
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Create config.yaml
        run: |
          # Create a config.yaml file for alembic to reach the database:
          echo "database:" >> config.yaml
          echo "  db: ${{ env.PG_DB }}" >> config.yaml
          echo "  host: localhost" >> config.yaml
          echo "  password: ${{ env.PG_PASSWORD }}" >> config.yaml
          echo "  port: 5432" >> config.yaml
          echo "  user: postgres" >> config.yaml

      - name: Test Alembic versions
        run: |
          alembic upgrade head

      - name: Run python tests
        run: |
          PYTHONPATH=$(pwd) pytest app/ -v --tb=short -s
