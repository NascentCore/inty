name: CI

on:
  push:
    branches:
      - main
    paths:
      - "start.sh"
      - "app/**/*.py"
      - "tests/**/*.py"
      - "scripts/init_admin_user.py"
      - "requirements.txt"
      - "test_requirements.txt"
      - ".github/workflows/ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "alembic/versions/**/*.py"
      - "start.sh"
      - "app/**/*.py"
      - "tests/**/*.py"
      - "scripts/init_admin_user.py"
      - "requirements.txt"
      - "test_requirements.txt"
      - ".github/workflows/ci.yaml"

env:
  PG_USER: postgres
  PG_PASSWORD: sxwl666!
  PG_DB: inty

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      pgsql:
        # Cannot access env var here. So use hardcoded image.
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: ${{ env.PG_USER }}
          POSTGRES_PASSWORD: ${{ env.PG_PASSWORD }}
          POSTGRES_DB: ${{ env.PG_DB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: 3.12
          # This does not seem to work: https://github.com/actions/setup-python/issues/330
          # Keep for posterity, we do want to use this such that we do not need to manage cache ourselves.
          # cache: 'pip'

      # Based on https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/
      - uses: actions/cache@v4
        with:
          path: .venv
          # Unique key for the cache
          key: ${{ runner.os }}-venv-${{ hashFiles('requirements.txt', 'test_requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-venv-

      - name: Install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt
          python -m pip install -r test_requirements.txt
          # https://stackoverflow.com/a/74669486
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Run python tests
        run: |
          cp config.yaml.example config.yaml
          # alembic upgrade head: no need to run, as start.sh already includes it
          ./start.sh --dev &
          # Wait for the server to start. If the time is too short, it needs to be increased.
          sleep 10
          # noci marker is defined in pytest.ini
          # applied on test functions with noci marker will be skipped on CI
          pytest -m "not noci" -v -s tests/
