name: Release - Build and deploy Inty backend

on:
  push:
    branches:
      - main
    paths:
      # 后端代码
      - "app/**/*.py"
      - "app/services/push_*.py"
      - "app/services/push_worker.py"
      - "alembic/**/*.py"
      # 开发环境配置文件
      - "devops/config.yaml.dev"
      - "devops/config.yaml.prod"
      # 评测系统
      - "evaluation/**/*.tsx"
      - "evaluation/tsconfig.json"
      - "evaluation/tsconfig.node.json"
      - "evaluation/package.json"
      - "evaluation/package-lock.json"
      - "evaluation/vite.config.ts"
      - "evaluation/vitest.config.ts"
      - "evaluation/index.html"
      - "evaluation/build.sh"
      # 容器
      - "Dockerfile"
      - "Dockerfile.push-worker"
      - "start_push_worker.sh"
      # 工作流文件
      - ".github/workflows/build_and_deploy_backend.yml"

  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: The environment to deploy to
        required: true
        default: dev

concurrency:
  group: ${{ github.workflow }}-${{ inputs.environment || 'dev' }}
  # Do not cancel in-progress builds.
  cancel-in-progress: false

env:
  INTY_SERVER_IMAGE: ghcr.io/nascentcore/inty-backend/inty-server
  INTY_PUSH_WORKER_IMAGE: ghcr.io/nascentcore/inty-backend/inty-push-worker

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      # Push to ghcr.io
      packages: write
      # Checkout repository
      contents: read

    # 自动运行的情况下，inputs.environment 为空，因此需要额外设置
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - id: prep
        run: |
          echo "environment=${{ inputs.environment || 'dev' }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.ref_name }}-${{ inputs.environment || 'dev' }}" >> $GITHUB_OUTPUT

      - name: Check prep output
        run: |
          echo "environment=${{ steps.prep.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "image_tag=${{ steps.prep.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY

      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      - id: build-docker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.INTY_SERVER_IMAGE }}:${{ steps.prep.outputs.image_tag }}
          # https://docs.docker.com/build/ci/github-actions/cache/#cache-backend-api
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CONFIG_FILE=devops/config.yaml.${{ steps.prep.outputs.environment }}

      - id: build-push-worker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.push-worker
          push: true
          tags: ${{ env.INTY_PUSH_WORKER_IMAGE }}:${{ steps.prep.outputs.image_tag }}
          # https://docs.docker.com/build/ci/github-actions/cache/#cache-backend-api
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CONFIG_FILE=devops/config.yaml.${{ steps.prep.outputs.environment }}

      - name: Pull deployment images
        uses: appleboy/ssh-action@master
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            sudo docker pull ${{ env.INTY_SERVER_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}
            sudo docker pull ${{ env.INTY_PUSH_WORKER_IMAGE }}@${{ steps.build-push-worker-image.outputs.digest }}

      - name: Deploy backend and push worker to ${{ steps.prep.outputs.environment }}
        uses: appleboy/ssh-action@master
        # 这个限制这一步最长时间，同时内部有一个等待的循环，从而保证不会超时。
        timeout-minutes: 5
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo docker stop inty-backend-${{ steps.prep.outputs.environment }} || true
            sudo docker rm inty-backend-${{ steps.prep.outputs.environment }} || true
            # log-driver: https://docs.docker.com/engine/logging/drivers/gcplogs/
            #   运行于 gcp 环境，docker engine 探测 gcp 环境信息，相关设置都自动提取
            #   https://docs.docker.com/engine/logging/drivers/gcplogs/#gcplogs-options
            # LANGCHAIN_* 相关环境变量应该不需要设置，已经在代码中强制设置，以后考虑清理
            # https://github.com/NascentCore/inty/blob/ef9c9735c62a9cb2d6be4b2414bebed410f1ff56/app/core/config.py#L267
            sudo docker run --detach --log-driver=gcplogs \
              --name inty-backend-${{ steps.prep.outputs.environment }} \
              --restart unless-stopped \
              --publish ${{ vars.SERVICE_PORT_ON_HOST }}:8000 \
              --env LANGCHAIN_TRACING_V2=true \
              --env LANGCHAIN_PROJECT=inty-backend-${{ steps.prep.outputs.environment }} \
              --env LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
              --label application=inty-backend \
              --label environment=${{ steps.prep.outputs.environment }} \
              --log-opt labels=application,environment \
              --volume /opt/inty-${{ steps.prep.outputs.environment }}/inty-backend-key.json:/inty-backend-key.json \
              --volume /opt/inty-${{ steps.prep.outputs.environment }}/inty-firebase-key.json:/inty-firebase-key.json \
              ${{ env.INTY_SERVER_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}
              echo "Waiting for application startup..."
              while ! sudo docker logs inty-backend-${{ steps.prep.outputs.environment }} 2>&1 | grep -q "Application startup complete"
              do
              sleep 1
              done
              if [ $? -eq 0 ]; then
                echo "Application startup complete detected!"
              else
                echo "Timeout waiting for application startup"
                exit 1
              fi
            sudo docker stop inty-push-worker-${{ steps.prep.outputs.environment }} || true
            sudo docker rm inty-push-worker-${{ steps.prep.outputs.environment }} || true
            sudo docker run --detach --log-driver=gcplogs \
              --name inty-push-worker-${{ steps.prep.outputs.environment }} \
              --restart unless-stopped \
              --env LANGCHAIN_TRACING_V2=true \
              --env LANGCHAIN_PROJECT=inty-push-worker-${{ steps.prep.outputs.environment }} \
              --env LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
              --label application=inty-push-worker \
              --label environment=${{ steps.prep.outputs.environment }} \
              --log-opt labels=application,environment \
              --volume /opt/inty-${{ steps.prep.outputs.environment }}/inty-backend-key.json:/inty-backend-key.json \
              --volume /opt/inty-${{ steps.prep.outputs.environment }}/inty-firebase-key.json:/inty-firebase-key.json \
              ${{ env.INTY_PUSH_WORKER_IMAGE }}@${{ steps.build-push-worker-image.outputs.digest }}
            echo "Waiting for push worker service startup..."
            max_wait=30
            wait_interval=2
            elapsed=0
            container_started=false
            while [ $elapsed -lt $max_wait ]; do
              if sudo docker ps | grep -q "inty-push-worker-${{ steps.prep.outputs.environment }}"; then
                container_started=true
                echo "Push worker service container is running"
                break
              fi
              sleep $wait_interval
              elapsed=$((elapsed + wait_interval))
              echo "Waiting for container to start... (${elapsed}s/${max_wait}s)"
            done
            if [ "$container_started" = true ]; then
              echo "Push worker service started successfully!"
              log_check=$(sudo docker logs inty-push-worker-${{ steps.prep.outputs.environment }} 2>&1 | grep -q "推送服务初始化完成\|推送服务启动成功" && echo "found" || echo "not_found")
              if [ "$log_check" = "found" ]; then
                echo "Push worker service initialized successfully (found in logs)!"
              else
                echo "Note: Initialization message not found in docker logs (expected when using gcplogs driver)."
                echo "Service is running. Check Google Cloud Logging for detailed logs."
              fi
            else
              echo "Error: Push worker service failed to start within ${max_wait} seconds"
              echo "Container status:"
              sudo docker ps -a | grep "inty-push-worker-${{ steps.prep.outputs.environment }}" || echo "Container not found"
              echo "Attempting to get logs (may be empty with gcplogs):"
              sudo docker logs inty-push-worker-${{ steps.prep.outputs.environment }} 2>&1 || true
              exit 1
            fi

      - name: Sanity check
        run: |
          curl --verbose --fail --retry 5 --retry-delay 5 ${{ vars.SERVICE_PUBLIC_URL }}

      - name: Write summary
        run: |
          echo "## Build and deploy"
          echo "GitHub ref: ${{ github.ref }}"
          echo "Deployed to ${{ steps.prep.outputs.environment }} for ${{ vars.SERVICE_PUBLIC_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "Backend image: ${{ env.INTY_SERVER_IMAGE }}:${{ steps.prep.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "Push worker image: ${{ env.INTY_PUSH_WORKER_IMAGE }}:${{ steps.prep.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
