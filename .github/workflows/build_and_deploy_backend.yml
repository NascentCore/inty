name: Release - iMate 后端

on:
  push:
    branches:
      - main
    paths:
      # 后端代码（与 IntelliMate 共用 monorepo 源码）
      - "app/**/*.py"
      - "alembic/**/*.py"
      - "backend/inty/*.py"
      - "backend/inty/start.sh"
      # iMate 开发环境配置（push main 默认部署到 GitHub Environment imate-dev）
      - "devops/config.yaml.imate_dev"
      # - "devops/config.yaml.prod"
      # 评测系统；已经迁移到 ops.inty.cc/evaluation dev.ops.inty.cc/evaluation backend/ops/
      # - "evaluation/**/*.tsx"
      # - "evaluation/tsconfig.json"
      # - "evaluation/tsconfig.node.json"
      # - "evaluation/package.json"
      # - "evaluation/package-lock.json"
      # - "evaluation/vite.config.ts"
      # - "evaluation/vitest.config.ts"
      # - "evaluation/index.html"
      # - "evaluation/build.sh"
      # 容器
      - "devops/docker/Dockerfile"
      # 工作流文件暂时取消掉，减少运行频率
      # - ".github/workflows/build_and_deploy_backend.yml"

  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: The environment to deploy to
        required: true
        default: imate-dev

  schedule:
    # GitHub Environment imate-prod（与手动选 imate-prod 一致）
    # 美西凌晨 3 点 UTC（Pacific）：11 AM UTC = 3:00 PST（冬令时），夏令时期间为当地 4:00
    - cron: "0 11 * * *"

# 部署环境解析（以下三处表达式必须完全一致；concurrency 与 jobs.*.environment 不能使用 job env）：
#   concurrency.group
#   jobs.build-and-deploy.environment
#   jobs.build-and-deploy.env.DEPLOY_ENV
# 语义：workflow_dispatch -> inputs.environment；schedule -> imate-prod；其余（如 push main）-> imate-dev
#
# iMate Android（imate_android_app core BuildConfig.API_BASE_URL）与 GitHub Environment vars.SERVICE_PUBLIC_URL 对齐：
#   imate-dev  -> https://dev.imate.inty.cc/（对应 app debug）
#   imate-prod -> https://imate.inty.cc/（对应 app release）
concurrency:
  group: inty-deploy-backend-${{ inputs.environment || (github.event_name == 'schedule' && 'imate-prod') || 'imate-dev' }}
  cancel-in-progress: true

env:
  INTY_SERVER_IMAGE: ghcr.io/nascentcore/inty-backend/inty-server

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'
    env:
      DEPLOY_ENV: ${{ inputs.environment || (github.event_name == 'schedule' && 'imate-prod') || 'imate-dev' }}

    permissions:
      # Push to ghcr.io
      packages: write
      # Create tag/release (and checkout repository)
      contents: write

    environment: ${{ inputs.environment || (github.event_name == 'schedule' && 'imate-prod') || 'imate-dev' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - id: prep
        run: |
          echo "environment=${{ env.DEPLOY_ENV }}" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.ref_name }}-${{ env.DEPLOY_ENV }}" >> $GITHUB_OUTPUT
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Check prep output
        run: |
          echo "environment=${{ steps.prep.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "image_tag=${{ steps.prep.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY

      - id: map
        run: |
          case "${{ steps.prep.outputs.environment }}" in
            dev)
              echo "config_file=devops/config.yaml.dev" >> $GITHUB_OUTPUT
              echo "container_name=inty-backend-dev" >> $GITHUB_OUTPUT
              echo "keys_dir=/opt/inty-dev" >> $GITHUB_OUTPUT
              echo "app_label=inty-backend" >> $GITHUB_OUTPUT
              echo "langchain_project=inty-backend-dev" >> $GITHUB_OUTPUT
              ;;
            prod)
              echo "config_file=devops/config.yaml.prod" >> $GITHUB_OUTPUT
              echo "container_name=inty-backend-prod" >> $GITHUB_OUTPUT
              echo "keys_dir=/opt/inty-prod" >> $GITHUB_OUTPUT
              echo "app_label=inty-backend" >> $GITHUB_OUTPUT
              echo "langchain_project=inty-backend-prod" >> $GITHUB_OUTPUT
              ;;
            imate-dev)
              echo "config_file=devops/config.yaml.imate_dev" >> $GITHUB_OUTPUT
              echo "container_name=inty-backend-imate-dev" >> $GITHUB_OUTPUT
              echo "keys_dir=/opt/inty-imate-dev" >> $GITHUB_OUTPUT
              echo "app_label=inty-backend-imate" >> $GITHUB_OUTPUT
              echo "langchain_project=inty-backend-imate-dev" >> $GITHUB_OUTPUT
              ;;
            imate-prod)
              echo "config_file=devops/config.yaml.imate_prod" >> $GITHUB_OUTPUT
              echo "keys_dir=/opt/inty-imate-prod" >> $GITHUB_OUTPUT
              echo "app_label=inty-backend-imate" >> $GITHUB_OUTPUT
              echo "langchain_project=inty-backend-imate-prod" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "Unsupported environment: ${{ steps.prep.outputs.environment }}"
              exit 1
              ;;
          esac

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          cache-binary: true

      - id: build-docker-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./devops/docker/Dockerfile
          push: true
          tags: ${{ env.INTY_SERVER_IMAGE }}:${{ steps.prep.outputs.image_tag }}
          # https://docs.docker.com/build/ci/github-actions/cache/#cache-backend-api
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CONFIG_FILE=${{ steps.map.outputs.config_file }}
            INTY_VCS_REVISION=${{ github.sha }}
            INTY_BUILD_TIME=${{ steps.prep.outputs.build_time }}

      - name: Pull deployment images
        uses: appleboy/ssh-action@v1.2.5
        timeout-minutes: 15
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            sudo docker pull ${{ env.INTY_SERVER_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}

      - name: Deploy backend to ${{ steps.prep.outputs.environment }}
        uses: appleboy/ssh-action@v1.2.5
        timeout-minutes: 30
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo docker stop ${{ steps.prep.outputs.environment == 'imate-prod' && vars.CONTAINER_NAME || steps.map.outputs.container_name }} || true
            sudo docker rm ${{ steps.prep.outputs.environment == 'imate-prod' && vars.CONTAINER_NAME || steps.map.outputs.container_name }} || true
            # log-driver: https://docs.docker.com/engine/logging/drivers/gcplogs/
            #   运行于 gcp 环境，docker engine 探测 gcp 环境信息，相关设置都自动提取
            #   https://docs.docker.com/engine/logging/drivers/gcplogs/#gcplogs-options
            # LANGCHAIN_* 相关环境变量应该不需要设置，已经在代码中强制设置，以后考虑清理
            # https://github.com/NascentCore/inty/blob/ef9c9735c62a9cb2d6be4b2414bebed410f1ff56/app/core/config.py#L267
            sudo docker run --detach --log-driver=gcplogs \
              --name ${{ steps.prep.outputs.environment == 'imate-prod' && vars.CONTAINER_NAME || steps.map.outputs.container_name }} \
              --restart unless-stopped \
              --publish ${{ vars.SERVICE_PORT_ON_HOST }}:8000 \
              --env LANGCHAIN_TRACING_V2=true \
              --env LANGCHAIN_PROJECT=${{ steps.map.outputs.langchain_project }} \
              --env LANGCHAIN_API_KEY=${{ secrets.LANGCHAIN_API_KEY }} \
              --label application=${{ steps.map.outputs.app_label }} \
              --label environment=${{ steps.prep.outputs.environment }} \
              --log-opt labels=application,environment \
              --volume ${{ steps.map.outputs.keys_dir }}/inty-backend-key.json:/inty-backend-key.json \
              --volume ${{ steps.map.outputs.keys_dir }}/inty-firebase-key.json:/inty-firebase-key.json \
              ${{ env.INTY_SERVER_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}
            echo "Waiting for HTTP readiness on 127.0.0.1:${{ vars.SERVICE_PORT_ON_HOST }} ..."
            n=0
            max_wait=600
            while ! curl -sfS --max-time 3 "http://127.0.0.1:${{ vars.SERVICE_PORT_ON_HOST }}/" >/dev/null
            do
              n=$((n + 1))
              if [ "$n" -ge "$max_wait" ]; then
                echo "Timeout after ${max_wait}s waiting for GET / on published port"
                sudo docker logs ${{ steps.prep.outputs.environment == 'imate-prod' && vars.CONTAINER_NAME || steps.map.outputs.container_name }} 2>&1 | tail -n 120
                exit 1
              fi
              sleep 1
            done
            echo "Backend responded on localhost; startup complete."

      - name: Sanity check
        run: |
          curl --verbose --fail --retry 5 --retry-delay 5 ${{ vars.SERVICE_PUBLIC_URL }}

      - name: Create GitHub Release for prod deploy
        if: ${{ steps.prep.outputs.environment == 'prod' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          TAG="${SHORT_SHA}-prod"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; skipping create."
            exit 0
          fi

          NOTES="$(printf '%s\n' \
            'Prod 部署完成。' \
            '' \
            "- Tag: ${TAG}" \
            "- Commit: ${GITHUB_SHA}" \
            '- Environment: prod' \
            '- Backend image digest: ${{ steps.build-docker-image.outputs.digest }}' \
            '- Service URL: ${{ vars.SERVICE_PUBLIC_URL }}' \
            '- Workflow run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}' \
          )"

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "$NOTES"

      - name: Write summary
        run: |
          echo "## Build and deploy"
          echo "GitHub ref: ${{ github.ref }}"
          echo "Container: ${{ steps.prep.outputs.environment == 'imate-prod' && vars.CONTAINER_NAME || steps.map.outputs.container_name }}" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to ${{ steps.prep.outputs.environment }} for ${{ vars.SERVICE_PUBLIC_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "Backend image: ${{ env.INTY_SERVER_IMAGE }}:${{ steps.prep.outputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.prep.outputs.environment }}" = "prod" ]; then
            echo "Release tag: ${GITHUB_SHA::7}-prod" >> $GITHUB_STEP_SUMMARY
          fi
