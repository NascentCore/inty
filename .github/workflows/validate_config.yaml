name: 验证 devops/ 下的配置文件

on:
  push:
    branches:
      - main
    paths:
      - "devops/config.yaml.*"
      - ".github/workflows/validate_config.yaml"
      - "devops/test_config_yaml_configs.py"
      - "app/core/config.py"
      - "app/utils/config.py"

  pull_request:
    branches:
      - main
    paths:
      - "devops/config.yaml.*"
      - ".github/workflows/validate_config.yaml"
      - "devops/test_config_yaml_configs.py"
      - "app/core/config.py"
      - "app/utils/config.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        id: setup-python
        with:
          python-version: 3.12
          # This does not seem to work: https://github.com/actions/setup-python/issues/330
          # Keep for posterity, we do want to use this such that we do not need to manage cache ourselves.
          # cache: 'pip'

      # Based on https://adamj.eu/tech/2023/11/02/github-actions-faster-python-virtual-environments/
      # Include Python version in key so restored venv symlinks match current interpreter
      - uses: actions/cache@v4
        with:
          path: .venv
          key: ${{ runner.os }}-py-${{ steps.setup-python.outputs.python-version }}-venv-${{ hashFiles('requirements.txt', 'tests/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-py-${{ steps.setup-python.outputs.python-version }}-venv-

      - name: Install dependencies
        run: |
          # Create venv only if it doesn't exist (cache miss)
          if [ ! -d .venv ]; then
            python -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install -r requirements.txt
          python -m pip install -r tests/requirements.txt
          # https://stackoverflow.com/a/74669486
          echo "$VIRTUAL_ENV/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV

      - name: Validate configs
        run: |
          # TODO(INTY_CONFIG_YAML): replace cp with INTY_CONFIG_YAML=devops/config.yaml.test
          # config.py 默认加载 config.yaml 文件，因此需要创建一份
          cp devops/config.yaml.test config.yaml
          pytest -v -s devops/test_config_yaml_configs.py
