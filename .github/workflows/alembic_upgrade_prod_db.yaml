name: Alembic Upgrade Production DB Schema

on:
  workflow_dispatch:

jobs:
  alembic-upgrade-prod:
    runs-on: inty-prod-server-gcp
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upgrade production database
        run: alembic -c devops/config.yaml.prod upgrade head
