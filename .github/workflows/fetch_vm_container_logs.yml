name: Debug - fetch VM container logs

on:
  workflow_dispatch:
    inputs:
      container:
        description: Docker container name or alias (ops-dev, ops-prod, backend-dev, ...)
        required: true
        default: ops-dev
        type: string
      tail_lines:
        description: Number of log lines to print
        required: true
        default: "200"
        type: string
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fetch_vm_container_logs.yml"

jobs:
  fetch-logs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve container and fetch logs
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          capture_stdout: true
          script: |
            set -euo pipefail
            input="${{ inputs.container || 'ops-dev' }}"
            tail_lines="${{ inputs.tail_lines || '300' }}"
            case "${input}" in
              ops-dev) container="inty-ops-dev" ;;
              ops-prod) container="inty-ops-prod" ;;
              backend-dev) container="inty-backend-dev" ;;
              backend-prod) container="inty-backend-prod" ;;
              inty-*) container="${input}" ;;
              *) container="${input}" ;;
            esac
            echo "=== docker ps -a (filter: ${container}) ==="
            sudo docker ps -a --filter "name=${container}" || true
            echo "=== docker inspect state ==="
            sudo docker inspect "${container}" --format 'Status={{.State.Status}} ExitCode={{.State.ExitCode}} OOMKilled={{.State.OOMKilled}} Error={{.State.Error}} Started={{.State.StartedAt}}' 2>/dev/null || true
            echo "=== docker logs (tail ${tail_lines}) ==="
            sudo docker logs "${container}" 2>&1 | tail -n "${tail_lines}" || true
            echo "=== weixin/ilink/bridge filtered (tail ${tail_lines}) ==="
            sudo docker logs "${container}" 2>&1 | tail -n "${tail_lines}" \
              | grep -iE 'weixin|wechat|ilink|bridge|restore|errcode|-14|session expired' || true
            echo "=== listening on 8001 ==="
            sudo ss -ltnp | grep ':8001' || true
