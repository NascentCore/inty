name: Build and Deploy Dev

on:
  push:
    branches: [ main ]
    paths:
      - '**.py'
    paths-ignore:
      - '.github/workflows/**'
  workflow_dispatch:

env:
  DOCKER_IMAGE: inty-backend
  DOCKER_TAG: ${{ github.sha }}
  REGISTRY: registry.cn-beijing.aliyuncs.com/sxwl-ai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Login to Aliyun Container Registry
      uses: docker/login-action@v2
      with:
        registry: registry.cn-beijing.aliyuncs.com
        username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
        password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
        
    - name: Deploy to development server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER_HOST }}
        username: ${{ secrets.DEV_SERVER_USER }}
        key: ${{ secrets.DEV_SERVER_SSH_KEY }}
        script: |
          # 拉取新镜像
          sudo docker pull ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }}
          
          # 停止并删除旧容器
          sudo docker stop inty-backend || true
          sudo docker rm inty-backend || true
          
          # 运行新容器
          sudo docker run -d \
            --name inty-backend \
            --restart unless-stopped \
            -p 8000:8000 \
            -v /opt/inty/config.yaml:/app/config.yaml \
            -v /opt/inty/inty-backend-key.json:/app/inty-backend-key.json \
            -v /opt/inty/inty-firebase-key.json:/app/inty-firebase-key.json \
            ${{ env.REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ env.DOCKER_TAG }} 
