# CREATED_BY_AGENT
name: User analytics report fallback

on:
  # 兜底策略：晚于 push_worker 默认 UTC 06:00 执行
  schedule:
    # 日报兜底：每日 UTC 08:00，统计 T-1
    - cron: "0 8 * * *"
    # 周报兜底：每周一 UTC 09:00，统计上一周（周一）
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      report_type:
        description: "Report type"
        required: true
        default: "daily"
        type: choice
        options:
          - daily
          - weekly
      report_date:
        description: "Report date YYYY-MM-DD (optional, empty means auto)"
        required: false
        default: ""
      force:
        description: "Force overwrite existing report"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: user-analytics-report-fallback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    # 使用自建 runner 访问生产私网 DB
    runs-on: inty-prod-server-gcp
    if: github.event_name != 'schedule' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare config
        run: |
          cp devops/config.yaml.prod config.yaml

      - name: Resolve target report type/date
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_REPORT_TYPE: ${{ inputs.report_type }}
          INPUT_REPORT_DATE: ${{ inputs.report_date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          export TZ=UTC

          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$EVENT_SCHEDULE" = "0 8 * * *" ]; then
              REPORT_TYPE="daily"
            elif [ "$EVENT_SCHEDULE" = "0 9 * * 1" ]; then
              REPORT_TYPE="weekly"
            else
              echo "Unsupported schedule: $EVENT_SCHEDULE" >&2
              exit 1
            fi
            FORCE="false"
          else
            REPORT_TYPE="$INPUT_REPORT_TYPE"
            FORCE="$INPUT_FORCE"
          fi

          if [ -n "${INPUT_REPORT_DATE:-}" ]; then
            REPORT_DATE="$INPUT_REPORT_DATE"
          else
            if [ "$REPORT_TYPE" = "daily" ]; then
              REPORT_DATE="$(python -c "from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc).date() - timedelta(days=1)).isoformat())")"
            elif [ "$REPORT_TYPE" = "weekly" ]; then
              REPORT_DATE="$(python -c "from datetime import datetime, timedelta, timezone; t=datetime.now(timezone.utc).date(); print((t - timedelta(days=t.weekday()+7)).isoformat())")"
            else
              echo "Unsupported report type: $REPORT_TYPE" >&2
              exit 1
            fi
          fi

          echo "report_type=$REPORT_TYPE" >> "$GITHUB_OUTPUT"
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"

      - name: Run report generation
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          CMD="python tools/scripts/run_user_analytics_report.py --type ${{ steps.resolve.outputs.report_type }} --date ${{ steps.resolve.outputs.report_date }}"
          if [ "${{ steps.resolve.outputs.force }}" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "Running: $CMD"
          eval "$CMD"

      - name: Write summary
        run: |
          echo "## User analytics report fallback" >> "$GITHUB_STEP_SUMMARY"
          echo "event_name=${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "report_type=${{ steps.resolve.outputs.report_type }}" >> "$GITHUB_STEP_SUMMARY"
          echo "report_date=${{ steps.resolve.outputs.report_date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "force=${{ steps.resolve.outputs.force }}" >> "$GITHUB_STEP_SUMMARY"
