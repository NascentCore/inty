# CREATED_BY_AGENT
# Production IntelliMate daily usage report (T-1 UTC, primary DB when replica_host omitted).
# Push worker user_analytics_report.daily_enabled defaults to false — do not re-enable there
# while this workflow runs, to avoid duplicate rollups / replica conflicts.
# See docs/FR_USER_ANALYTICS_REPORTS.md.
name: Daily - IntelliMate User Activity Report

# 手动：仓库 Actions → 本 workflow →「Run workflow」（可选填日期、是否 force）。
on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "Report date YYYY-MM-DD (empty = T-1 UTC)"
        required: false
        default: ""
      force:
        description: "Force overwrite existing report row"
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 6 * * *"  # UTC 06:00 daily (independent of push worker config)

permissions:
  contents: read

concurrency:
  group: daily-primary-db-usage-report
  cancel-in-progress: false

jobs:
  daily_usage:
    runs-on: inty-prod-server-gcp
    # 手动触发任意分支均可跑；定时仅在 default 分支（main）执行。
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Use prod IntelliMate DB config (primary when replica omitted)
        # TODO(INTY_CONFIG_YAML): replace cp with INTY_CONFIG_YAML=devops/config.yaml.prod on run step env
        run: cp devops/config.yaml.prod config.yaml

      - name: Resolve report date (T-1 UTC if unset)
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REPORT_DATE: ${{ github.event.inputs.report_date }}
        run: |
          set -euo pipefail
          export TZ=UTC
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_REPORT_DATE:-}" ]; then
            REPORT_DATE="$INPUT_REPORT_DATE"
          else
            REPORT_DATE="$(python -c "from datetime import datetime, timedelta, timezone; print((datetime.now(timezone.utc).date() - timedelta(days=1)).isoformat())")"
          fi
          echo "report_date=$REPORT_DATE" >> "$GITHUB_OUTPUT"

      - name: Run daily usage report
        env:
          PYTHONPATH: .
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          set -euo pipefail
          CMD="python tools/scripts/run_user_analytics_report.py --type daily --date ${{ steps.resolve.outputs.report_date }}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${INPUT_FORCE:-}" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "Running: $CMD"
          eval "$CMD"

      - name: Write summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          echo "## Daily primary DB usage report" >> "$GITHUB_STEP_SUMMARY"
          echo "event_name=$EVENT_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "report_date=${{ steps.resolve.outputs.report_date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "force=${INPUT_FORCE:-}" >> "$GITHUB_STEP_SUMMARY"
