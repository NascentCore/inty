# 手动部署 nginx 站点配置到 inty 服务器；dev/prod 同机，environment 仅用于审批与审计
name: Deploy nginx config (sxwl.ai)

on:
  workflow_dispatch:

concurrency:
  group: deploy-nginx-conf-to-inty-prod-server
  cancel-in-progress: true

jobs:
  deploy-nginx:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy nginx config to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "devops/nginx/conf.d/sxwl.ai.conf"
          target: "/tmp"
          overwrite: true  # remote /tmp/sxwl.ai.conf may exist from prior runs; tar needs overwrite
          strip_components: 3  # devops/nginx/conf.d → file lands at /tmp/sxwl.ai.conf

      - name: Install config and restart nginx
        uses: appleboy/ssh-action@master
        timeout-minutes: 2
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo cp /tmp/sxwl.ai.conf /etc/nginx/conf.d/sxwl.ai.conf
            sudo nginx -t # 验证配置；失败则立即退出，不重启
            sudo systemctl restart nginx
            sudo systemctl status nginx

      - name: Write summary
        run: |
          echo "## Deploy nginx config" >> $GITHUB_STEP_SUMMARY
          echo "Ref: ${{ github.ref }} @ ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Target: \`/etc/nginx/conf.d/sxwl.ai.conf\` on inty server" >> $GITHUB_STEP_SUMMARY
