name: format_code

on:
  schedule:
    # 每天 00:00 北京时间（UTC+8）；GitHub 使用 UTC 定时
    - cron: '0 16 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install black
        run: pip install --upgrade pip && pip install black

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: evaluation/package-lock.json

      - name: Install frontend deps (evaluation)
        working-directory: evaluation
        run: npm ci

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install ktfmt (via Maven Central jar)
        run: |
          curl -fsSL https://repo1.maven.org/maven2/com/facebook/ktfmt/0.49/ktfmt-0.49-jar-with-dependencies.jar -o ktfmt.jar
          sudo mkdir -p /usr/local/lib/ktfmt
          sudo mv ktfmt.jar /usr/local/lib/ktfmt/ktfmt.jar
          sudo tee /usr/local/bin/ktfmt >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec java -jar /usr/local/lib/ktfmt/ktfmt.jar "$@"
          EOF
          sudo chmod +x /usr/local/bin/ktfmt

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run fmt.sh (format entire repo)
        run: ./fmt.sh --all

      - name: Push changes (if any)
        run: git push
