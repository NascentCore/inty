name: 格式化所有代码文件

on:
  schedule:
    # 每天 00:00 北京时间（UTC+8）；GitHub 使用 UTC 定时
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dev tools (Black + pinned versions)
        run: pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: evaluation/package-lock.json

      - name: Install frontend deps (evaluation)
        working-directory: evaluation
        run: npm ci

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install ktfmt (via Maven Central jar)
        run: |
          # 来自官方 github 仓库发布页面的 jar 包
          curl -fsSL https://github.com/facebook/ktfmt/releases/download/v0.59/ktfmt-0.59-with-dependencies.jar -o ktfmt.jar
          sudo mkdir -p /usr/local/lib/ktfmt
          sudo mv ktfmt.jar /usr/local/lib/ktfmt/ktfmt.jar
          sudo tee /usr/local/bin/ktfmt >/dev/null <<'EOF'
          #!/usr/bin/env bash
          exec java -jar /usr/local/lib/ktfmt/ktfmt.jar "$@"
          EOF
          sudo chmod +x /usr/local/bin/ktfmt

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run tools/scripts/fmt.sh (format entire repo)
        env:
          FMT_NO_COMMIT: "true"
        run: ./tools/scripts/fmt.sh --all

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: format code (automated)"
          title: "chore: format code (automated)"
          body: |
            This PR applies automated formatting via tools/scripts/fmt.sh.

            - Python: black (from requirements-dev.txt), paths aligned with CI
            - Kotlin: ktfmt
            - JS/TS: prettier (evaluation)
          branch: automation/format-code
          delete-branch: true
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        id: create-pr

      - name: Enable auto-merge for Pull Request
        if: steps.create-pr.outputs.pull-request-number
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pull-request-number }}"

          if gh pr merge --auto --squash "$PR_NUMBER"; then
            echo "Auto-merge enabled for PR #$PR_NUMBER"
          else
            echo "::warning::Failed to enable auto-merge for PR #$PR_NUMBER; closing the pull request."
            gh pr close "$PR_NUMBER" --comment "Auto-merge failed in CI, so this automated formatting PR is being closed." || \
              echo "::warning::Failed to close PR #$PR_NUMBER after auto-merge failure."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Pull Request URL to summary
        if: steps.create-pr.outputs.pull-request-url
        run: |
          {
            echo "### Pull Request URL";
            echo;
            echo '```';
            echo "${{ steps.create-pr.outputs.pull-request-url }}";
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
