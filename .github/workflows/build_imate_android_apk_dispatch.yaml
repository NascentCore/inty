# 手动触发：构建 iMate Debug APK，上传为 GitHub Artifact，供内测安装（不上传 Play）。
# 与 Release workflow 共用 Gradle 缓存路径约定，见 build_and_upload_imate_android.yaml。

name: Manual - iMate Debug APK（测试）

on:
  workflow_dispatch:

concurrency:
  group: imate-apk-dispatch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: android-builder
    timeout-minutes: 60

    env:
      IMATE_APK_PATH: imate_android_app/app/build/outputs/apk/debug/app-debug.apk

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            imate_android_app/.gradle
            imate_android_app/build
            imate_android_app/app/build
            imate_android_app/core/build
          key: ${{ runner.os }}-gradle-imate-apk-${{ hashFiles('imate_android_app/**/*.gradle*', 'imate_android_app/**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-imate-apk-${{ hashFiles('imate_android_app/**/*.gradle*', 'imate_android_app/**/gradle-wrapper.properties') }}-

      - name: Build debug APK (assembleDebug)
        run: |
          cd imate_android_app
          ./gradlew :app:assembleDebug

      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: imate-app-debug-apk
          path: ${{ env.IMATE_APK_PATH }}
          retention-days: 14

      - name: Publish build summary
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "## iMate Debug APK"
            echo
            echo "- 构建变体: \`debug\` (\`assembleDebug\`)"
            echo "- APK 路径（runner 内）: \`${{ env.IMATE_APK_PATH }}\`"
            echo "- **下载（GitHub Artifact）**: [本次 workflow 运行页 - Artifacts]($RUN_URL)"
            echo
            echo "在运行页底部 **Artifacts** 中下载 \`imate-app-debug-apk\`（ZIP 内含 \`app-debug.apk\`）。"
          } >> "$GITHUB_STEP_SUMMARY"
