# 构建 release 构建类型并上传到 Google Play Internal Testing 轨道。
name: Release - Build and upload aab to Google Play internal testing track

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:

  schedule:
    # 3 pm UTC, 11 pm Beijing time.
    - cron: "0 15 * * *"

jobs:
  build-aab:
    # 此为 GitHub 托管的 8 核大机器，能够在 5 分钟内完成构建。
    runs-on: android-builder
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android_app/.gradle
            android_app/build
            android_app/app/build
            android_app/core/common/build
            android_app/core/data/build
            android_app/core/design/build
            android_app/core/firebase/build
            android_app/library/network/build
            android_app/library/utils/build
          # https://github.com/actions/cache/blob/main/examples.md#java---gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-

      - name: Build release bundle (AAB)
        run: |
          cd android_app
          ./gradlew bundleRelease
      - name: Upload release bundle to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_GPLAY_UPLOAD }}
          packageName: com.ai.intellimate
          releaseFiles: android_app/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Publish upload summary
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          {
            echo "## 上传产物摘要"
            echo
            echo "- 提交短 SHA: \`$SHORT_SHA\`"
            echo "- AAB 路径: \`android_app/app/build/outputs/bundle/release/app-release.aab\`"
          } >> "$GITHUB_STEP_SUMMARY"
