name: Release - IntelliMate GPlay 内测轨道 

on:
  push:
    paths:
      - "android_app/**"
      - ".github/workflows/build_and_upload_android.yaml"

  workflow_dispatch:

jobs:
  build-aab:
    # 此为 GitHub 托管的 8 核大机器，能够在 5 分钟内完成构建。
    runs-on: android-builder
    timeout-minutes: 60

    permissions:
      # Create tag
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle dependencies and build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android_app/.gradle
            android_app/build
            android_app/app/build
            android_app/core/common/build
            android_app/core/data/build
            android_app/core/design/build
            android_app/core/firebase/build
            android_app/library/network/build
            android_app/library/utils/build
          # https://github.com/actions/cache/blob/main/examples.md#java---gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}-

      - name: Build release bundle (AAB)
        run: |
          cd android_app
          ./gradlew bundleRelease

      - name: Upload AAB to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android_app/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Upload release bundle to Google Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY_GPLAY_UPLOAD }}
          packageName: com.ai.intellimate
          releaseFiles: android_app/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          changesNotSentForReview: false

      - name: Create and push tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          TAG_NAME="${SHORT_SHA}-android"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          echo "Creating tag: $TAG_NAME for commit: $SHORT_SHA"

          # 检查 tag 是否已存在
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists; skipping creation."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push origin "$TAG_NAME"

          echo "Successfully created and pushed tag: $TAG_NAME"

      - name: Create pre-release and upload AAB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          AAB_PATH="android_app/app/build/outputs/bundle/release/app-release.aab"

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "GitHub Release $TAG_NAME already exists; uploading AAB only."
            gh release upload "$TAG_NAME" "$AAB_PATH" --clobber
            exit 0
          fi

          NOTES="IntelliMate 内测构建，提交 \`${TAG_NAME%-android}\`。"
          gh release create "$TAG_NAME" "$AAB_PATH" \
            --prerelease \
            --title "IntelliMate 内测 $TAG_NAME" \
            --notes "$NOTES"

      - name: Publish upload summary
        run: |
          TAG_NAME="${{ steps.tag.outputs.tag_name }}"
          SHORT_SHA="${TAG_NAME%-android}"
          ARTIFACT_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$TAG_NAME"
          {
            echo "## 上传产物摘要"
            echo
            echo "- 提交短 SHA: \`$SHORT_SHA\`"
            echo "- Tag: \`$TAG_NAME\`"
            echo "- AAB 路径: \`android_app/app/build/outputs/bundle/release/app-release.aab\`"
            echo "- GitHub Artifacts: [查看并下载 AAB]($ARTIFACT_URL)"
            echo "- Pre-release（含 AAB）: [$TAG_NAME]($RELEASE_URL)"
          } >> "$GITHUB_STEP_SUMMARY"
