name: Build and deploy inty evaluation app

on:
  push:
    branches:
      - main
    paths:
      - "evaluation/**/*"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  INTY_EVAL_IMAGE: ghcr.io/nascentcore/inty-backend/inty-eval

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      # Push to ghcr.io
      packages: write
      # Checkout repository
      contents: read

    environment: dev
    
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/setup-buildx-action@v3
      with:
        cache-binary: true
        
    - id: build-docker-image
      uses: docker/build-push-action@v6
      with:
        context: ./evaluation
        push: true
        tags: ${{ env.INTY_EVAL_IMAGE }}:${{ github.ref_name }}
        platforms: linux/amd64
        build-args: |
          REACT_APP_API_BASE_URL='https://dev.inty.sxwl.ai/api/v1'
        # https://docs.docker.com/build/ci/github-actions/cache/#cache-backend-api
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Deploy
      uses: appleboy/ssh-action@master
      timeout-minutes: 1
      with:
        host: ${{ vars.EVAL_SERVER_HOST }}
        username: ${{ vars.EVAL_SERVER_USER }}
        key: ${{ secrets.EVAL_SERVER_SSH_KEY }}
        script: |
          # Login to ghcr.io
          sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          
          # Pull the new image
          sudo docker pull ${{ env.INTY_EVAL_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}
          
          # Stop and remove existing container
          sudo docker stop inty-eval
          sudo docker rm inty-eval

          # Run new container
          sudo docker run --detach \
            --name inty-eval \
            --restart unless-stopped \
            --publish ${{ vars.EVAL_SERVICE_PORT_ON_HOST }}:80 \
            --label application=inty-eval \
            --label environment=dev \
            ${{ env.INTY_EVAL_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}

    - name: Sanity check
      run: |
        # Wait a bit more for the app to fully start
        sleep 30
        curl --verbose --fail --retry 3 --retry-delay 10 ${{ vars.EVAL_SERVICE_PUBLIC_URL }}

    - name: Write summary
      run: |
        echo "## Build and deploy inty evaluation app"
        echo "GitHub ref: ${{ github.ref }}"
        echo "Deployed to dev environment"
        echo "Service URL: ${{ vars.EVAL_SERVICE_PUBLIC_URL }}" >> $GITHUB_STEP_SUMMARY
