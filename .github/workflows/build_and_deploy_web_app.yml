name: Build and deploy IntelliMate web app [还未验证]

on:
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        description: The environment to deploy to
        required: true
        default: dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn dependencies
        uses: actions/cache@v3
        with:
          path: |
            ${{ steps.yarn-cache-dir-path.outputs.dir }}
            web_app/node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('web_app/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Configure Git for private repository access
        run: |
          git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://${GITHUB_TOKEN}@github.com/".insteadOf "git+ssh://git@github.com:"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        working-directory: web_app
        run: yarn install --frozen-lockfile

      - name: Build web app
        working-directory: web_app
        run: yarn build

      - name: Create deployment archive
        run: |
          cd web_app
          tar czf ../intellimate-app-dist.tar.gz -C dist .

      - name: Upload deployment archive
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          source: "intellimate-app-dist.tar.gz"
          target: "/tmp/"

      - name: Deploy to ${{ steps.set-environment.outputs.environment }}
        uses: appleboy/ssh-action@master
        timeout-minutes: 2
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SERVER_USER }}
          key: ${{ secrets.DEV_SERVER_SSH_KEY }}
          script: |
            sudo rm -rf /var/www/dev.intellimate.app && sudo mkdir -p /var/www/dev.intellimate.app
            sudo tar xzf /tmp/intellimate-app-dist.tar.gz -C /var/www/dev.intellimate.app
            sudo chown -R www-data:www-data /var/www/dev.intellimate.app
            sudo chmod -R 755 /var/www/dev.intellimate.app
            sudo rm -f /tmp/intellimate-app-dist.tar.gz

      - name: Sanity check
        run: |
          curl --verbose --fail --retry 5 --retry-delay 5 https://dev.intellimate.app

      - name: Write summary
        run: |
          echo "## Build and deploy web app" >> $GITHUB_STEP_SUMMARY
          echo "GitHub ref: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to ${{ steps.set-environment.outputs.environment }} for https://dev.intellimate.app" >> $GITHUB_STEP_SUMMARY
