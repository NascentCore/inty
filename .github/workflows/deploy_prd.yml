name: Build and Deploy Prd

on:
  workflow_dispatch:

env:
  DOCKER_REGISTRY: registry.cn-beijing.aliyuncs.com
  DOCKER_REPO: sxwl-ai/inty-backend
  DOCKER_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - uses: docker/setup-buildx-action@v3
      
    - uses: docker/login-action@v2
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
        password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        
    - uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }}
        
    - name: Deploy to prd server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER_HOST }}
        username: ${{ secrets.DEV_SERVER_USER }}
        key: ${{ secrets.DEV_SERVER_SSH_KEY }}
        script: |
          sudo docker pull ${{ env.REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }}
          sudo docker stop inty-backend-prd || true
          sudo docker rm inty-backend-prd || true
          sudo docker run -d \
            --name inty-backend-prd \
            --restart unless-stopped \
            -p 8100:8000 \
            -v /opt/inty-prd/config.yaml:/app/config.yaml \
            -v /opt/inty-prd/inty-backend-key.json:/app/inty-backend-key.json \
            -v /opt/inty-prd/inty-firebase-key.json:/app/inty-firebase-key.json \
            ${{ env.REGISTRY }}/${{ env.DOCKER_REPO }}:${{ env.DOCKER_TAG }} 
