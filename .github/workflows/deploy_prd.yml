name: Build and deploy to production environment

on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      # Push to ghcr.io
      packages: write
      # Checkout repository
      contents: read

    environment: prod
    
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/setup-buildx-action@v3
      with:
        cache-binary: true
        
    - id: build-docker-image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/nascentcore/inty-backend/inty-server:${{ github.ref_name }}
        
    - name: Deploy to prd server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER_HOST }}
        username: ${{ secrets.DEV_SERVER_USER }}
        key: ${{ secrets.DEV_SERVER_SSH_KEY }}
        script: |
          sudo docker pull ${{ steps.build-docker-image.outputs.imageid }}
          sudo docker stop inty-backend-prd || true
          sudo docker run --detach --rm \
            --name inty-backend-prd \
            --restart unless-stopped \
            --publish 8100:8000 \
            --volume /opt/inty-prd/config.yaml:/app/config.yaml \
            --volume /opt/inty-prd/inty-backend-key.json:/app/inty-backend-key.json \
            --volume /opt/inty-prd/inty-firebase-key.json:/app/inty-firebase-key.json \
            ${{ steps.build-docker-image.outputs.imageid }}
    - name: Sanity check
      run: |
        curl ${{ vars.SERVICE_PUBLIC_URL }}
