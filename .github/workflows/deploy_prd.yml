name: Build and deploy to production environment

on:
  workflow_dispatch:

env:
  INTY_SERVER_IMAGE: ghcr.io/nascentcore/inty-backend/inty-server
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      # Push to ghcr.io
      packages: write
      # Checkout repository
      contents: read

    environment: prod
    
    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - uses: docker/setup-buildx-action@v3
      with:
        cache-binary: true
        
    - id: build-docker-image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ env.INTY_SERVER_IMAGE }}:${{ github.ref_name }}
        
    - name: Deploy to prod server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEV_SERVER_HOST }}
        username: ${{ secrets.DEV_SERVER_USER }}
        key: ${{ secrets.DEV_SERVER_SSH_KEY }}
        script: |
          sudo docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          sudo docker pull ${{ env.INTY_SERVER_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}
          sudo docker stop inty-backend-prod || true
          sudo docker run --detach \
            --name inty-backend-prod \
            --restart unless-stopped \
            --publish ${{ vars.SERVICE_PORT }}:8000 \
            --volume /opt/inty-prod/config.yaml:/app/config.yaml \
            --volume /opt/inty-prod/inty-backend-key.json:/app/inty-backend-key.json \
            --volume /opt/inty-prod/inty-firebase-key.json:/app/inty-firebase-key.json \
            ${{ env.INTY_SERVER_IMAGE }}@${{ steps.build-docker-image.outputs.digest }}
    - name: Sanity check
      run: |
        curl ${{ vars.SERVICE_PUBLIC_URL }}
