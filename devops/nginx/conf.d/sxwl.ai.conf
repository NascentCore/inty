    server_name dev.imate.inty.cc;
    client_max_body_size 100M;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/dev.imate.sxwl.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.imate.sxwl.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

server {
    server_name dev.imate.sxwl.ai dev.imate.inty.cc;
    listen 80;
    location /.well-known/acme-challenge/ {
        root /var/www/inty.cc;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

