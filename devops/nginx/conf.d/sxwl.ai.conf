# iMate dev Ops（:8201）。GitHub `imate-dev`：`OPS_SERVICE_PUBLIC_URL` = `https://dev.imate.inty.cc`。与后端 `dev.imate.sxwl.ai` 共用同一张 Let's Encrypt 证书（`dev.imate.sxwl.ai`，SAN 含 `dev.imate.inty.cc`）。
