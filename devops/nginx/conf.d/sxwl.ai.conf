# Production instance of inty backend.

# 注意：gzip 配置已在主配置文件 /etc/nginx/nginx.conf 的 http 块中定义
# 如需更详细的 gzip 配置，请修改主配置文件
server {
    server_name app.inty.cc;
    client_max_body_size 100M;
    location / {
        proxy_pass http://localhost:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/app.inty.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/app.inty.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = app.inty.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    server_name app.inty.cc;
    listen 80;
    return 404; # managed by Certbot
}

