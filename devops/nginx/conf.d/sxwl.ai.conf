server {
    server_name intellimate.app www.intellimate.app;
    root /var/www/intellimate.app;
    index index.html;

    # API 反向代理到后端服务
    location /api {
        proxy_pass https://app.inty.cc;  # 后端 API 服务 URL
        proxy_http_version 1.1;
        proxy_set_header Host app.inty.cc;  # 改为目标主机名
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # 特别重要的认证相关头信息
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
        proxy_set_header Cookie $http_cookie;

        proxy_buffering off;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存策略（带 hash 的文件名可以长期缓存）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 文件不缓存（确保更新及时生效）
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/intellimate.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/intellimate.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.intellimate.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    if ($host = intellimate.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    server_name intellimate.app www.intellimate.app;
    listen 80;
    return 404; # managed by Certbot
}

