server {
    server_name intellimate.app www.intellimate.app;
    root /var/www/intellimate.app;
    index index.html;
    location / {
        try_files $uri $uri/ =404;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/intellimate.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/intellimate.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

