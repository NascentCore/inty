# 复制为 config.yaml 或 config.local.yaml 后按环境修改；勿将含真实 token 的文件提交到 git。
#
# Token 优先级：命令行 --token > 环境变量 INTY_BEARER_TOKEN > 本文件中的 bearer_token
# 说明：Cursor 聊天里无法像终端那样「持久设置」环境变量；要跑通脚本可以：
#   1) 在 Cursor / VS Code 的「集成终端」里先 export INTY_BEARER_TOKEN=... 再执行 python；或
#   2) 在本机复制的配置里填 bearer_token（见下方），推荐用 config.local.yaml，已被本 skill 的 .gitignore 忽略

# 可选。若填写，与 INTY_BEARER_TOKEN 二选一即可
# bearer_token: ""

# HTTP(S) 根地址，与 REST 基址一致（脚本会自行转换为 ws/wss）
api_base_url: "http://127.0.0.1:8000"

# 为 true 时通过 POST /api/v1/ai/agents 新建 PRIVATE 测试用角色，无需事先填写 agent_id
# create_agent: false

# 要对话的 agent id（create_agent 为 true 时可省略；若同时指定则 create_agent 优先并忽略本字段）
agent_id: ""

# 单轮用户消息
user_message: "你好，简单回复即可。"

# 为 true 时，在 WebSocket URL 上带 ?agent_id=，以触发服务端可能下发的 interactive bootstrap kickoff
connect_kickoff: false

# 可选：连接与收包的超时（秒），不设则与 tools/inty_v2_repl/backend_chat_ws 默认一致
# connect_timeout_sec: 30
# recv_timeout_sec: 600

# 可选：创建 agent 的 HTTP 超时（秒），不设则至少 60
# create_agent_http_timeout_sec: 60
